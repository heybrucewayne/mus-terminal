<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MUS Terminal</title>
<meta name="theme-color" content="#071416" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #05070e;
    --bg2: #04060c;
    --panel: linear-gradient(160deg, rgba(26,36,62,0.46) 0%, rgba(11,17,32,0.36) 100%);
    --panel-flat: rgba(13,19,34,0.6);
    --glass: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.12);
    --border-soft: rgba(255,255,255,0.06);
    --green: #00ff88;
    --green-dim: #0a8f55;
    --red: #ff4466;
    --red-dim: #a8324a;
    --yellow: #ffd23f;
    --orange: #ff9f43;
    --text: #c7d2e0;
    --text-bright: #e8f0fb;
    --muted: #5b6b82;
    --muted2: #3c4a5e;
    --accent-glow: rgba(0,255,136,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  html { background: var(--bg); }
  body { background: transparent; position: relative; }
  /* colorful aurora behind the frosted-glass panels */
  body::before {
    content: ''; position: fixed; inset: -25%; z-index: -2; pointer-events: none;
    background:
      radial-gradient(52% 56% at 10% 12%, rgba(0,255,170,0.55), transparent 70%),
      radial-gradient(56% 58% at 92% 6%,  rgba(70,150,255,0.58), transparent 70%),
      radial-gradient(60% 64% at 84% 92%, rgba(185,100,255,0.50), transparent 70%),
      radial-gradient(54% 60% at 12% 96%, rgba(255,80,130,0.46), transparent 70%),
      radial-gradient(46% 48% at 50% 50%, rgba(0,220,255,0.30), transparent 72%);
    filter: saturate(145%);
    animation: auroraDrift 26s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(2.5%, -2.5%, 0) scale(1.1); }
  }

  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* ===== APP SHELL ===== */
  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }
  ::selection { background: rgba(0,255,136,0.25); }

  /* ===== GRID ===== */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 0.6fr 1.25fr 1fr 1.05fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    -webkit-backdrop-filter: blur(24px) saturate(165%);
    backdrop-filter: blur(24px) saturate(165%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.16),
      inset 0 0 0 1px rgba(255,255,255,0.02),
      0 10px 34px rgba(0,0,0,0.45),
      0 2px 10px rgba(0,0,0,0.30);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }
  /* glass specular sheen from the top */
  .panel::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 16px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 42%);
  }

  .panel-body { flex: 1 1 auto; min-height: 0; position: relative; }
  .scroll { overflow-y: auto; overflow-x: hidden; height: 100%; }

  /* scrollbars */
  .scroll::-webkit-scrollbar, .panel-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll::-webkit-scrollbar-thumb, .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* ===== BUBBLES ===== */
  #bubbleCanvas { display:block; width:100%; height:100%; cursor: default; }
  #bubbleTip {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    background: rgba(16,22,40,0.72);
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 9px 11px;
    font-size: 11px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 12px 34px rgba(0,0,0,0.55);
    display: none;
    min-width: 150px;
  }
  #bubbleTip .t-sym { font-weight: 700; font-size: 13px; letter-spacing: 1px; color: var(--text-bright); margin-bottom: 4px; }
  #bubbleTip .t-row { display:flex; justify-content:space-between; gap:14px; margin: 2px 0; }
  #bubbleTip .t-row .k { color: var(--muted); }

  /* ===== PRICE TABLE ===== */
  table.ticker { width: 100%; border-collapse: collapse; }
  table.ticker thead th {
    position: sticky; top: 0; z-index: 2;
    background: rgba(255,255,255,0.035);
    -webkit-backdrop-filter: none; backdrop-filter: none;
    text-align: right;
    font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    padding: 8px 12px 7px;
    border-bottom: 1px solid var(--border-soft);
  }
  table.ticker thead th:first-child { text-align: left; }
  table.ticker thead th[data-sort] { cursor: pointer; user-select: none; transition: color .12s; }
  table.ticker thead th[data-sort]:hover { color: var(--text-bright); }
  table.ticker thead th.sorted { color: var(--green); }
  .sort-ar { font-size: 8px; color: var(--green); }
  table.ticker tbody td {
    padding: 6px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
  }
  table.ticker tbody td:first-child { text-align: left; }
  table.ticker tbody tr:hover { background: rgba(255,255,255,0.05); }
  table.ticker tbody tr.asset-row { cursor: pointer; }
  table.ticker tbody tr.asset-row:focus-visible { outline: 1px solid rgba(0,255,136,.7); outline-offset: -1px; }
  .sym-cell { display:flex; align-items:center; gap:8px; min-width:0; }
  .sym-cell .base {
    flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    font-weight:600; color:var(--text-bright); letter-spacing:.5px;
  }
  .sym-cell .quote {
    flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    font-size:9px; color:var(--muted2);
  }
  .rank { flex:0 0 16px; color:var(--muted2); font-size:10px; width:16px; display:inline-block; text-align:right; }
  .kind-tag { flex:0 0 auto; font-size:8px; letter-spacing:.5px; padding:1px 7px; border-radius:999px; margin-left:auto; font-family:'Space Grotesk',sans-serif; font-weight:600; border:1px solid; white-space:nowrap; }
  .kind-tag.t-COIN      { color:#2dd4bf; border-color:rgba(45,212,191,.34); background:rgba(45,212,191,.10); }
  .kind-tag.t-STOCK     { color:#3fb6ff; border-color:rgba(63,182,255,.34); background:rgba(63,182,255,.10); }
  .kind-tag.t-INDEX     { color:#c77dff; border-color:rgba(199,125,255,.34); background:rgba(199,125,255,.10); }
  .kind-tag.t-COMMODITY { color:#ffd23f; border-color:rgba(255,210,63,.34); background:rgba(255,210,63,.10); }

  /* prices search / add */
  #panel-table .panel-body { display:flex; flex-direction:column; }
  .px-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; }
  .px-search { display:flex; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border-soft); }
  .px-search input { flex:1; }
  .px-search .btn { padding:6px 10px; font-size:11px; }
  .px-msg { font-size:10px; padding:0 12px; height:0; overflow:hidden; color:var(--muted); transition:height .15s, padding .15s; }
  .px-msg.show { height:auto; padding:5px 12px; }
  .px-msg.ok { color:var(--green); } .px-msg.err { color:var(--red); }
  @keyframes flashUp { 0%{ background: rgba(0,255,136,0.22);} 100%{ background: transparent;} }
  @keyframes flashDown { 0%{ background: rgba(255,68,102,0.22);} 100%{ background: transparent;} }
  td.fu { animation: flashUp 1.1s ease-out; }
  td.fd { animation: flashDown 1.1s ease-out; }
  .pricecell { font-weight: 600; color: var(--text-bright); }
  .chgpill { display:inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; min-width: 58px; border:1px solid transparent; }
  .chgpill.pos { background: rgba(0,255,136,0.12); border-color: rgba(0,255,136,0.28); }
  .chgpill.neg { background: rgba(255,68,102,0.12); border-color: rgba(255,68,102,0.28); }
  .perf-trigger {
    appearance:none; font-family:'JetBrains Mono',monospace; line-height:1.35;
    color:inherit; cursor:pointer; transition:transform .12s, filter .12s, box-shadow .12s;
  }
  .perf-trigger:hover { transform:translateY(-1px); filter:brightness(1.18); }
  .perf-trigger:focus-visible { outline:1px solid currentColor; outline-offset:2px; }

  /* ===== INPUTS / BUTTONS ===== */
  input, select {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    width: 100%;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus, select:focus { border-color: rgba(0,255,136,0.55); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 3px rgba(0,255,136,0.10); }
  input::placeholder { color: var(--muted2); }
  input[type=date] { color-scheme: dark; }
  .btn {
    background: rgba(0,255,136,0.14);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,255,136,0.4);
    color: var(--green);
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover { background: rgba(0,255,136,0.26); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 16px rgba(0,255,136,0.22); }
  .btn.full { width:100%; }
  .x-btn {
    background: none; border: none; color: var(--muted2);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 2px;
    transition: color .15s;
  }
  .x-btn:hover { color: var(--red); }

  .empty {
    color: var(--muted); font-size: 11px; text-align:center;
    padding: 18px 12px; line-height: 1.6;
  }
  .empty .ico { font-size: 20px; display:block; margin-bottom:6px; opacity:.5; }

  /* ===== SKELETONS ===== */
  .skel { position:relative; overflow:hidden; background:rgba(255,255,255,0.05); border-radius:9px; }
  .skel::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skel-row { height: 26px; margin: 7px 12px; }

  @media (max-width: 1380px){
    body { font-size: 12px; }
    .grid { grid-template-columns: 0.58fr 1.2fr 1fr 1fr; }
  }

</style>
<style id="terminal-refresh">
  /* Focused desktop terminal: no page scroll, only the prices list scrolls internally. */
  html, body {
    height: 100%;
    min-height: 100%;
    overflow: hidden;
  }

  body {
    background: transparent;
  }

  body::before {
    z-index: 0;
    inset: -18px;
    opacity: 0.94;
    background:
      linear-gradient(135deg, rgba(4, 14, 15, 0.18), rgba(3, 10, 15, 0.30)),
      url('background.jpeg') center / cover no-repeat;
    filter: blur(1px) saturate(108%);
    animation: none;
    transform: none;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: none;
    height: 100vh;
    min-height: 0;
    margin: 0 auto;
    padding: 14px clamp(12px, 1.2vw, 24px) 18px;
    gap: 12px;
  }

  .grid {
    --bubble-width: 61%;
    --prices-height: 54%;
    display: grid;
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    height: auto;
    grid-template-columns: minmax(340px, var(--bubble-width)) minmax(360px, 1fr);
    grid-template-rows: minmax(220px, var(--prices-height)) minmax(220px, 1fr);
    gap: 12px;
  }

  .panel-resizer {
    position:absolute; z-index:30; border:0; padding:0; background:transparent;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .panel-resizer::before {
    content:''; position:absolute; border-radius:999px;
    background:rgba(210,255,242,.32); box-shadow:0 0 10px rgba(0,255,136,.12);
    transition:background .14s, box-shadow .14s, transform .14s;
  }
  .panel-resizer:hover::before,
  .panel-resizer:focus-visible::before,
  .panel-resizer.active::before {
    background:rgba(0,255,136,.82); box-shadow:0 0 13px rgba(0,255,136,.52); transform:scale(1.08);
  }
  .panel-resizer:focus-visible { outline:none; }
  .resizer-columns {
    top:0; bottom:0; left:calc(var(--bubble-width) + 6px); width:12px;
    transform:translateX(-50%); cursor:col-resize;
  }
  .resizer-columns::before { width:2px; height:46px; left:5px; top:50%; transform:translateY(-50%); }
  .resizer-columns:hover::before,
  .resizer-columns:focus-visible::before,
  .resizer-columns.active::before { transform:translateY(-50%) scale(1.08); }
  .resizer-rows {
    left:calc(var(--bubble-width) + 12px); right:0; top:calc(var(--prices-height) + 6px); height:12px;
    transform:translateY(-50%); cursor:row-resize;
  }
  .resizer-rows::before { width:46px; height:2px; left:50%; top:5px; transform:translateX(-50%); }
  .resizer-rows:hover::before,
  .resizer-rows:focus-visible::before,
  .resizer-rows.active::before { transform:translateX(-50%) scale(1.08); }
  body.panel-resizing { cursor:grabbing; user-select:none; -webkit-user-select:none; }
  body.panel-resizing .panel { pointer-events:none; }

  .panel {
    min-width: 0;
    min-height: 0;
    isolation: isolate;
    border: 1px solid rgba(214, 255, 240, 0.2);
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(12, 30, 29, 0.28), rgba(5, 14, 18, 0.22));
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    -webkit-backdrop-filter: blur(7px) saturate(125%);
    backdrop-filter: blur(7px) saturate(125%);
  }

  .panel::before {
    z-index: 0;
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), transparent 34%);
  }

  .panel > .panel-body { position: relative; z-index: 1; }

  #panel-bubbles { border-color: rgba(141, 244, 182, 0.26); }
  #panel-bubbles { grid-row: 1 / span 2; }
  #panel-bubbles .panel-body {
    background:
      linear-gradient(135deg, rgba(4, 19, 20, 0.07), rgba(4, 10, 14, 0.04)),
      radial-gradient(circle at 48% 48%, rgba(57, 220, 134, 0.045), transparent 58%);
  }
  #panel-table .panel-body {
    background: linear-gradient(135deg, rgba(4, 16, 18, 0.07), rgba(4, 10, 14, 0.04));
  }
  #panel-table table.ticker thead th {
    color:rgba(229,241,239,.76);
    text-shadow:0 1px 3px rgba(0,0,0,.78);
  }
  #panel-table table.ticker tbody td {
    color:rgba(237,246,244,.9);
    text-shadow:0 1px 3px rgba(0,0,0,.72);
  }
  #panel-table .sym-cell .base,
  #panel-table .pricecell { color:#f2faf8; }
  #panel-table .sym-cell .quote {
    color:rgba(210,226,223,.62);
    font-weight:600;
  }
  #panel-table .rank { color:rgba(202,220,216,.62); }
  #panel-table .px-search input {
    color:#eff9f7;
    background:rgba(5,14,17,.16);
    text-shadow:0 1px 2px rgba(0,0,0,.65);
  }
  #panel-table .px-search input::placeholder { color:rgba(204,221,218,.64); opacity:1; }
  #panel-table .sym-cell { min-width:0; flex-wrap:nowrap; }
  #bubbleCanvas { position: relative; z-index: 1; }

  /* ===== SOL MEME TRENCHES ===== */
  #panel-trenches { border-color:rgba(120,213,255,.24); }
  #panel-trenches .panel-body {
    display:flex; flex-direction:column;
    background:linear-gradient(135deg,rgba(5,18,22,.08),rgba(5,12,16,.035));
  }
  .trench-head {
    display:none; align-items:center; gap:9px; min-height:38px; padding:7px 10px;
    border-bottom:1px solid rgba(214,255,240,.10); background:rgba(255,255,255,.025);
  }
  .trench-title {
    color:var(--text-bright); font:700 9px 'Space Grotesk',sans-serif;
    letter-spacing:.16em; white-space:nowrap;
  }
  .trench-title::before {
    content:''; display:inline-block; width:6px; height:6px; margin-right:7px;
    border-radius:50%; background:#50d7ff; box-shadow:0 0 10px rgba(80,215,255,.85);
  }
  .trench-time { margin-left:auto; color:var(--muted); font:500 8px 'JetBrains Mono',monospace; white-space:nowrap; }
  .trench-refresh {
    width:25px; height:25px; padding:0; border:1px solid rgba(80,215,255,.25); border-radius:7px;
    background:rgba(80,215,255,.07); color:#76dcff; cursor:pointer; font-size:13px;
  }
  .trench-refresh:hover { border-color:rgba(80,215,255,.65); background:rgba(80,215,255,.15); }
  .trench-refresh:disabled { opacity:.45; cursor:wait; }
  .trench-scroll { flex:1 1 auto; min-height:0; overflow:auto; }
  table.trenches { width:100%; min-width:600px; border-collapse:collapse; table-layout:fixed; }
  table.trenches th {
    position:sticky; top:0; z-index:2; padding:9px 6px; border-bottom:1px solid rgba(214,255,240,.12);
    background:transparent; color:rgba(235,246,243,.82); font:600 10px 'Space Grotesk',sans-serif;
    letter-spacing:.08em; text-align:right; white-space:nowrap;
  }
  table.trenches th:first-child, table.trenches td:first-child { text-align:left; padding-left:10px; width:14%; }
  table.trenches th:nth-child(2), table.trenches td:nth-child(2) { width:12%; }
  table.trenches th:nth-child(3), table.trenches td:nth-child(3) { width:12%; }
  table.trenches th:nth-child(4), table.trenches td:nth-child(4) { width:28%; }
  table.trenches th:nth-child(5), table.trenches td:nth-child(5) { width:20%; }
  table.trenches th:nth-child(6), table.trenches td:nth-child(6) { width:14%; padding-right:10px; }
  table.trenches td {
    padding:9px 6px; border-bottom:1px solid rgba(255,255,255,.075); color:rgba(244,250,248,.94);
    font:600 11px 'JetBrains Mono',monospace; text-align:right; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .trench-symbol { color:#f5fffc; font-size:11.5px; }
  .trench-score { display:block; margin-top:3px; color:rgba(207,225,221,.72); font-size:8px; }
  .trench-decision { font-size:12px; }
  .trench-note {
    padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.06); color:rgba(241,248,246,.9);
    font:500 10px/1.5 'JetBrains Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .trench-note strong { color:var(--text-bright); }
  .trench-note a { color:#6bdcff; text-decoration:none; }
  .trench-note a:hover { text-decoration:underline; }
  .trench-change { color:#ffd66b; margin-left:5px; }
  .trench-eliminated, .trench-state {
    padding:9px 10px; color:rgba(221,235,232,.8); font:500 10px/1.45 'JetBrains Mono',monospace;
  }
  .trench-eliminated { color:rgba(255,137,157,.78); }
  .trench-state.err { color:var(--red); }
  #panel-trenches.command-focus { animation:trenchFocus .8s ease-out; }
  @keyframes trenchFocus { 0%,45%{box-shadow:0 0 0 2px rgba(80,215,255,.65),0 18px 42px rgba(0,0,0,.3)} 100%{box-shadow:0 18px 42px rgba(0,0,0,.3)} }

  table.ticker thead th,
  .btn {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }

  .asset-menu {
    position: fixed;
    z-index: 100;
    min-width: 218px;
    display: grid;
    gap: 6px;
    padding: 9px;
    border: 1px solid rgba(214,255,240,.28);
    border-radius: 12px;
    background: rgba(7, 18, 20, .94);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
    backdrop-filter: blur(18px) saturate(145%);
    box-shadow: 0 16px 36px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .asset-menu[hidden] { display:none; }
  .asset-menu-title {
    padding: 2px 4px 5px;
    color: var(--text-bright);
    font: 700 10px 'JetBrains Mono', monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .asset-menu-action {
    display:block;
    width:100%;

<script>
/* ============================================================
   MUS TERMINAL — vanilla JS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const fmtNum = (n, d=2) => Number(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
function smartPrice(p){
  p = +p;
  if (p >= 1000) return fmtNum(p, 2);
  if (p >= 1)    return fmtNum(p, 3);
  if (p >= 0.01) return fmtNum(p, 4);
  return fmtNum(p, 8);
}
function compact(n){
  n = +n;
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(2)+'K';
  return n.toFixed(0);
}
const cacheGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const cacheSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const APP_API_ORIGIN = location.protocol === 'file:' ? 'https://mus-terminal.vercel.app' : '';
async function fetchWithTimeout(url,options={},timeoutMs=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try { return await fetch(url,{...options,signal:controller.signal}); }
  finally { clearTimeout(timer); }
}

/* ============================================================
   RESIZABLE PANEL LAYOUT
   ============================================================ */
const PANEL_LAYOUT_KEY = 'mus_panel_layout_v1';
function setupPanelResizers(){
  const grid=$('.grid');
  const columnHandle=$('#resize-columns');
  const rowHandle=$('#resize-rows');
  if (!grid || !columnHandle || !rowHandle) return;

  const GAP=12;
  const stored=cacheGet(PANEL_LAYOUT_KEY);
  const state={
    columns:Number(stored?.columns),
    rows:Number(stored?.rows),
    dragAxis:null,
    pointerId:null,
    resizeFrame:0
  };
  const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
  const desktop=()=>matchMedia('(min-width:901px)').matches;
  const defaults=()=>({ columns:grid.clientWidth<=1380?.53:.61, rows:.54 });
  const validRatio=value=>isFinite(value) && value>0 && value<1;
  if (!validRatio(state.columns)) state.columns=defaults().columns;
  if (!validRatio(state.rows)) state.rows=defaults().rows;

  function bounds(rect){
    const compact=rect.width<=1380;
    return {
      minLeft:compact?320:340,
      minRight:compact?500:360,
      minTop:220,
      minBottom:220
    };
  }
  function applyLayout(){
    if (!desktop()) return;
    const rect=grid.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const limit=bounds(rect);
    const maxLeft=Math.max(limit.minLeft,rect.width-GAP-limit.minRight);
    const maxTop=Math.max(limit.minTop,rect.height-GAP-limit.minBottom);
    const left=clamp(rect.width*state.columns,limit.minLeft,maxLeft);
    const top=clamp(rect.height*state.rows,limit.minTop,maxTop);
    state.columns=left/rect.width;
    state.rows=top/rect.height;
    grid.style.setProperty('--bubble-width',`${left.toFixed(2)}px`);
    grid.style.setProperty('--prices-height',`${top.toFixed(2)}px`);
    columnHandle.setAttribute('aria-valuenow',String(Math.round(state.columns*100)));
    rowHandle.setAttribute('aria-valuenow',String(Math.round(state.rows*100)));
  }
  function saveLayout(){ cacheSet(PANEL_LAYOUT_KEY,{columns:state.columns,rows:state.rows}); }
  function resetLayout(){
    const next=defaults();
    state.columns=next.columns;
    state.rows=next.rows;
    applyLayout();
    saveLayout();
  }
  function beginDrag(axis,event){
    if (!desktop() || event.button!==0) return;
    event.preventDefault();
    state.dragAxis=axis;
    state.pointerId=event.pointerId;
    const handle=axis==='columns'?columnHandle:rowHandle;
    handle.classList.add('active');
    handle.setPointerCapture?.(event.pointerId);
    document.body.classList.add('panel-resizing');
  }
  function moveDrag(event){
    if (!state.dragAxis || event.pointerId!==state.pointerId) return;
    const rect=grid.getBoundingClientRect();
    const limit=bounds(rect);
    if (state.dragAxis==='columns'){
      const max=Math.max(limit.minLeft,rect.width-GAP-limit.minRight);
      state.columns=clamp(event.clientX-rect.left,limit.minLeft,max)/rect.width;
    } else {
      const max=Math.max(limit.minTop,rect.height-GAP-limit.minBottom);
      state.rows=clamp(event.clientY-rect.top,limit.minTop,max)/rect.height;
    }
    applyLayout();
  }
  function endDrag(event){
    if (!state.dragAxis || event.pointerId!==state.pointerId) return;
    const handle=state.dragAxis==='columns'?columnHandle:rowHandle;
    handle.classList.remove('active');
    if (handle.hasPointerCapture?.(event.pointerId)) handle.releasePointerCapture(event.pointerId);
    state.dragAxis=null;
    state.pointerId=null;
    document.body.classList.remove('panel-resizing');
    saveLayout();
  }
  function keyboardResize(axis,event){
    const relevant=axis==='columns' ? ['ArrowLeft','ArrowRight'] : ['ArrowUp','ArrowDown'];
    if (!relevant.includes(event.key)){
      if (event.key==='Home' || event.key==='Enter'){
        event.preventDefault();
        resetLayout();
      }
      return;
    }
    event.preventDefault();
    const rect=grid.getBoundingClientRect();
    const step=event.shiftKey?60:24;
    const positive=event.key==='ArrowRight' || event.key==='ArrowDown';
    if (axis==='columns') state.columns=(rect.width*state.columns+(positive?step:-step))/rect.width;
    else state.rows=(rect.height*state.rows+(positive?step:-step))/rect.height;
    applyLayout();
    saveLayout();
  }

  columnHandle.title='Drag to resize · double-click to reset';
  rowHandle.title='Drag to resize · double-click to reset';
  columnHandle.addEventListener('pointerdown',event=>beginDrag('columns',event));
  rowHandle.addEventListener('pointerdown',event=>beginDrag('rows',event));
  columnHandle.addEventListener('pointermove',moveDrag);
  rowHandle.addEventListener('pointermove',moveDrag);
  columnHandle.addEventListener('pointerup',endDrag);
  rowHandle.addEventListener('pointerup',endDrag);
  columnHandle.addEventListener('pointercancel',endDrag);
  rowHandle.addEventListener('pointercancel',endDrag);
  columnHandle.addEventListener('dblclick',resetLayout);
  rowHandle.addEventListener('dblclick',resetLayout);
  columnHandle.addEventListener('keydown',event=>keyboardResize('columns',event));
  rowHandle.addEventListener('keydown',event=>keyboardResize('rows',event));
  window.addEventListener('resize',()=>{
    cancelAnimationFrame(state.resizeFrame);
    state.resizeFrame=requestAnimationFrame(applyLayout);
  });
  requestAnimationFrame(applyLayout);
}

/* ============================================================
   SOL MEME TRENCHES
   ============================================================ */
const TRENCH_CACHE_KEY = 'mus_trenches_cache_v1';
const TRENCH_PREVIOUS_KEY = 'mus_trenches_previous_v1';
const TRENCH_AUTO_MS = 16 * 60 * 1000;
const TRENCH_API_BASE = `${APP_API_ORIGIN}/api/trenches`;
let trenchesLoading = false;

function trenchEscape(value){
  return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
}
function trenchMoney(value){
  const n=Number(value);
  if (!isFinite(n) || n<=0) return '—';
  if (n>=1e9) return '$'+(n/1e9).toFixed(1)+'B';
  if (n>=1e6) return '$'+(n/1e6).toFixed(1)+'M';
  if (n>=1e3) return '$'+(n/1e3).toFixed(n>=1e5?0:1)+'K';
  return '$'+n.toFixed(0);
}
function trenchPercent(value){
  const n=Number(value);
  if (!isFinite(n)) return '—';
  return `${n>=0?'+':''}${n.toFixed(Math.abs(n)>=100?0:1)}%`;
}
function trenchChanges(token, previous){
  if (!previous) return ['YENİ'];
  const changes=[];
  const currentH1=Number(token?.volume?.h1)||0;
  const previousH1=Number(previous?.volume?.h1)||0;
  if (currentH1>Math.max(1000,previousH1*1.4)) changes.push('HACİM+');
  if (token?.volume?.trend==='rising' && previous?.volume?.trend!=='rising') changes.push('İVME');
  if (token?.priceVolumeDivergence && !previous?.priceVolumeDivergence) changes.push('F/H!');
  if (Number(previous?.liquidity)>0 && Number(token?.liquidity)<Number(previous.liquidity)*.8) changes.push('LP↓');
  const securityFields=['mint','freeze','lpLockedPct','riskScore'];
  if (securityFields.some(key => String(token?.security?.[key])!==String(previous?.security?.[key]))) changes.push('GÜVENLİK Δ');
  if (token.decision!==previous.decision) changes.push('KARAR Δ');
  return changes;
}
function renderTrenches(payload){
  const content=$('#trench-content');
  const time=$('#trench-time');
  if (!content || !payload) return;
  const previousPayload=cacheGet(TRENCH_PREVIOUS_KEY);
  const previousMap=new Map((previousPayload?.tokens||[]).map(token=>[token.address,token]));
  const tokens=Array.isArray(payload.tokens)?payload.tokens:[];
  const rows=tokens.map(token=>{
    const changes=trenchChanges(token,previousMap.get(token.address));
    token._changes=changes;
    const decisionIcon=token.decision==='green'?'🟢':'🟡';
    return `<tr title="${trenchEscape(token.decisionLabel)}">
      <td><span class="trench-symbol">${trenchEscape(token.symbol)}</span><span class="trench-score">${Number(token.score)||0}/100</span></td>
      <td>${trenchMoney(token.marketCap)}</td>
      <td>${trenchMoney(token.liquidity)}</td>
      <td>${trenchMoney(token.volume?.h1)} / ${trenchMoney(token.volume?.h6)} / ${trenchMoney(token.volume?.h24)}</td>
      <td><span class="${Number(token.price?.h6)>=0?'pos':'neg'}">${trenchPercent(token.price?.h6)}</span> / <span class="${Number(token.price?.h24)>=0?'pos':'neg'}">${trenchPercent(token.price?.h24)}</span></td>
      <td class="trench-decision">${decisionIcon}</td>
    </tr>`;
  }).join('');
  const notes=tokens.map(token=>{
    const badges=token._changes?.length?`<span class="trench-change">${token._changes.map(trenchEscape).join(' · ')}</span>`:'';
    return `<div class="trench-note"><strong>${trenchEscape(token.symbol)}</strong> — ${trenchEscape(token.reason)}; <a href="${trenchEscape(token.rugUrl)}" target="_blank" rel="noopener noreferrer">RugCheck</a> · <a href="${trenchEscape(token.dexUrl)}" target="_blank" rel="noopener noreferrer">DexScreener</a>${badges}</div>`;
  }).join('');
  const reasons=(payload.eliminationReasons||[]).map(item=>`${trenchEscape(item.reason)} ${Number(item.count)||0}`).join(' · ');
  const eliminated=payload.eliminatedCount
    ? `<div class="trench-eliminated">🔴 ${Number(payload.eliminatedCount)} elendi${reasons?` — ${reasons}`:''}</div>`:'';
  const warning=payload.warning?`<div class="trench-state">${trenchEscape(payload.warning)}</div>`:'';
  const empty=!tokens.length?'<div class="trench-state">Uygun 🟢 veya 🟡 sonuç bulunamadı.</div>':'';
  content.outerHTML=`<div id="trench-content">
    <table class="trenches" aria-label="SOL Meme Trenches results"><thead><tr><th>Token</th><th>MC</th><th>LP</th><th>Hacim 1s / 6s / 24s</th><th>Fiyat 6s / 24s</th><th>Karar</th></tr></thead><tbody>${rows}</tbody></table>
    ${empty}${notes}${eliminated}${warning}
  </div>`;
  const date=new Date(payload.generatedAt);
  time.textContent=isNaN(date)?'—':date.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  cacheSet(TRENCH_CACHE_KEY,payload);
  if (previousPayload?.generatedAt!==payload.generatedAt) cacheSet(TRENCH_PREVIOUS_KEY,payload);
}
function trenchState(message,isError=false){
  const content=$('#trench-content');
  if (content) content.outerHTML=`<div id="trench-content" class="trench-state${isError?' err':''}">${trenchEscape(message)}</div>`;
}
async function loadTrenches(force=false){
  if (trenchesLoading) return;
  trenchesLoading=true;
  const button=$('#trench-refresh');
  if (button) button.disabled=true;
  const cached=cacheGet(TRENCH_CACHE_KEY);
  if (!force && cached) renderTrenches(cached);
  else trenchState('Solana tokenleri taranıyor…');
  try {
    const response=await fetchWithTimeout(`${TRENCH_API_BASE}${force?'?refresh=1':''}`,{cache:force?'no-store':'default'},25000);
    const payload=await response.json().catch(()=>({}));
    if (!response.ok) throw new Error(payload.error||`HTTP ${response.status}`);
    renderTrenches(payload);
  } catch(error){
    console.warn('trenches scan failed',error);
    if (!cached) trenchState('');
  } finally {
    trenchesLoading=false;
    if (button) button.disabled=false;
  }
}
function focusTrenches(force=false){
  const panel=$('#panel-trenches');
  if (!panel) return;
  panel.classList.remove('command-focus');
  void panel.offsetWidth;
  panel.classList.add('command-focus');
  setTimeout(()=>panel.classList.remove('command-focus'),900);
  if (matchMedia('(max-width:700px)').matches) panel.scrollIntoView({behavior:'smooth',block:'start'});
  loadTrenches(force);
}

/* ---------- Global state ---------- */
let tickerMap = {};        // BASE -> ticker obj (USDT pairs)
let tickerFetchInFlight = false;
const EXCLUDE = /(UPUSDT|DOWNUSDT|BULLUSDT|BEARUSDT)$/;

/* ============================================================
   BINANCE TICKER FETCH (shared by bubbles and table)
   ============================================================ */
async function fetchTickers(){
  if (tickerFetchInFlight) return false;
  tickerFetchInFlight = true;
  try {
    const res = await fetchWithTimeout('https://api.binance.com/api/v3/ticker/24hr',{},10000);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const all = await res.json();
    const usdt = all.filter(t =>
      t.symbol.endsWith('USDT') && !EXCLUDE.test(t.symbol) && +t.quoteVolume > 0
    );
    tickerMap = {};
    usdt.forEach(t => { tickerMap[t.symbol.replace(/USDT$/,'')] = t; });
    cacheSet('cc_tickers', usdt);
    renderAll();
    return true;
  } catch (e) {
    console.warn('ticker fetch failed', e);
    const cached = cacheGet('cc_tickers');
    if (cached && Object.keys(tickerMap).length === 0){
      tickerMap = {};
      cached.forEach(t => { tickerMap[t.symbol.replace(/USDT$/,'')] = t; });
      renderAll();
    }
    return false;
  } finally {
    tickerFetchInFlight = false;
  }
}

function renderAll(){
  refreshBubbles();
  renderMarketTable();
}

// bubble dataset = everything in the Prices table (crypto + TradFi),
// sized by |24h % change| → biggest movers (up OR down) get the biggest bubbles.
const TRADFI_BUBBLE = { SPX:'S&P', NDX:'NASDAQ', GOLD:'GOLD', OIL:'OIL' };
function refreshBubbles(){
  const items = [];
  CRYPTO_LIST.forEach(c => {
    if (isAssetHidden(c.base)) return;
    const t = tickerMap[c.base];
    if (!t) return;
    const pct = +t.priceChangePercent;
    items.push({ id:c.base, base:c.base, name:c.base, pair:'/USDT', kind:'crypto', cls:'COIN', usd:true, pct,
      price:+t.lastPrice, vol:+t.quoteVolume, high:+t.highPrice, low:+t.lowPrice, size:Math.abs(pct) });
  });
  if (hypeRow && !isAssetHidden('HYPE')){
    const pct = +hypeRow.chg || 0;
    items.push({ id:'HYPE', base:'HYPE', name:'HYPE', pair:'/USD', kind:'crypto', cls:'COIN', usd:true, pct,
      price:hypeRow.price, vol:hypeRow.vol, high:hypeRow.high, low:hypeRow.low, size:Math.abs(pct) });
  }
  TRADFI.forEach(f => {
    if (isAssetHidden(f.key)) return;
    const d = tradfiRows[f.key];
    if (!d) return;
    const pct = (d.chgPct!=null && isFinite(d.chgPct)) ? d.chgPct : (d.prev ? (d.price-d.prev)/d.prev*100 : 0);
    items.push({ id:f.key, base:TRADFI_BUBBLE[f.key]||f.name, name:f.name, full:f.name, kind:'tradfi', cls:f.cls, usd:f.usd, pct,
      price:d.price, vol:d.vol, high:d.high, low:d.low, size:Math.abs(pct) });
  });
  customItems.forEach(c => {
    const d = customAssetSnapshot(c);
    if (!d || !isFinite(+d.price)) return;
    const pct = isFinite(+d.chg) ? +d.chg : 0;
    items.push({
      ...d,
      base:d.name,
      pair:d.sub,
      pct,
      size:Math.abs(pct)
    });
  });
  bubbles.setData(items);
}

/* ============================================================
   1. CRYPTO BUBBLES (canvas physics)
   ============================================================ */
const bubbles = (function(){
  const canvas = $('#bubbleCanvas');
  const ctx = canvas.getContext('2d');
  const tip = $('#bubbleTip');
  let W=0, H=0, dpr = window.devicePixelRatio || 1;
  let nodes = [];
  let mouse = { x:-999, y:-999, over:false };
  let drag = null;   // { node, dx, dy, lastX, lastY } while a bubble is being dragged
  const EDGE = 12, EDGE_TOP = 12;   // keep bubbles inside the canvas

  function confine(n, bounce=false){
    const minX = n.r + EDGE;
    const maxX = Math.max(minX, W - n.r - EDGE);
    const minY = n.r + EDGE_TOP;
    const maxY = Math.max(minY, H - n.r - EDGE);
    if (n.x < minX){ n.x=minX; if (bounce) n.vx=Math.abs(n.vx)*0.55; }
    if (n.x > maxX){ n.x=maxX; if (bounce) n.vx=-Math.abs(n.vx)*0.55; }
    if (n.y < minY){ n.y=minY; if (bounce) n.vy=Math.abs(n.vy)*0.55; }
    if (n.y > maxY){ n.y=maxY; if (bounce) n.vy=-Math.abs(n.vy)*0.55; }
  }

  function resize(){
    const r = canvas.parentElement.getBoundingClientRect();
    const oldW=W, oldH=H;
    W = r.width; H = r.height;
    if (oldW > 0 && oldH > 0){
      nodes.forEach(n => { n.x = n.x / oldW * W; n.y = n.y / oldH * H; });
    }
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    layoutRadii();
    nodes.forEach(n => confine(n));
  }

  let raw = [];
  // setData accepts normalized items: { base, pair?, pct, price, vol, high, low, size }
  // `size` (= |24h % change|) drives the radius; `vol` is shown in the tooltip only.
  function setData(items){
    raw = items;
    if (!raw.length){ nodes=[]; return; }
    layoutRadii();
  }
  function layoutRadii(){
    if (!raw.length || !W) return;
    const sizes = raw.map(c => c.size);
    const maxV = Math.max(...sizes), minV = Math.min(...sizes);
    const area = W * H;
    // scale radii so total bubble area leaves enough room for stable collision resolution
    const target = area * 0.28;
    let rawAreas = raw.map(c => {
      const t = (Math.sqrt(c.size) - Math.sqrt(minV)) / (Math.sqrt(maxV) - Math.sqrt(minV) || 1);
      return 0.3 + t; // weight (floor so a flat coin is still visible)
    });
    const sumW = rawAreas.reduce((a,b)=>a+b,0);
    const k = target / (sumW * Math.PI);
    const existing = {};
    nodes.forEach(n => existing[n.base] = n);
    nodes = raw.map((c, i) => {
      const base = c.base;
      let r = Math.sqrt(rawAreas[i] * k);
      r = Math.max(15, Math.min(r, Math.min(W,H)*0.30));
      const prev = existing[base];
      const angle = i * 2.399963229728653;
      const spread = Math.sqrt((i+0.5)/raw.length) * Math.min(W, H) * 0.28;
      return {
        id:c.id||base, base, name:c.name||c.full||base, cls:c.cls,
        pair:c.pair, pct:c.pct, kind:c.kind, usd:c.usd, full:c.full,
        custom:Boolean(c.custom), rmsym:c.rmsym, source:c.source, cgId:c.cgId,
        tvSymbol:c.tvSymbol, tvExchange:c.tvExchange,
        price: c.price, vol: c.vol,
        high: c.high, low: c.low,
        r,
        x: prev ? prev.x : W/2 + Math.cos(angle)*spread,
        y: prev ? prev.y : (EDGE_TOP+H-EDGE)/2 + Math.sin(angle)*spread,
        vx: prev ? prev.vx : (Math.random()-0.5)*0.4,
        vy: prev ? prev.vy : (Math.random()-0.5)*0.4
      };
    });
    nodes.forEach(n => confine(n));
  }

  function step(){
    for (let i=0;i<nodes.length;i++){
      const a = nodes[i];
      if (drag && a === drag.node) continue;   // pinned to the cursor while dragging
      // gentle drift
      a.vx += (Math.random()-0.5)*0.03;
      a.vy += (Math.random()-0.5)*0.03;
      a.vx *= 0.985; a.vy *= 0.985;
      a.vx = Math.max(-1.2, Math.min(1.2, a.vx));
      a.vy = Math.max(-1.2, Math.min(1.2, a.vy));
      // mild centering pull
      a.vx += ((W/2 - a.x)) * 0.00012;
      a.vy += ((((EDGE_TOP+H-EDGE)/2) - a.y)) * 0.00012;
      a.x += a.vx; a.y += a.vy;
      confine(a, true);
    }
    // Two relaxation passes prevent persistent overlap after resize or rapid data updates.
    for (let pass=0; pass<2; pass++){
      for (let i=0;i<nodes.length;i++){
        for (let j=i+1;j<nodes.length;j++){
          const a=nodes[i], b=nodes[j];
          let dx=b.x-a.x, dy=b.y-a.y;
          let dist=Math.hypot(dx,dy);
          if (dist < 0.001){
            const angle = ((i+1)*31 + (j+1)*17) % 360 * Math.PI / 180;
            dx=Math.cos(angle)*0.01; dy=Math.sin(angle)*0.01; dist=0.01;
          }
          const min=a.r+b.r+9;
          if (dist < min){
            const ov=(min-dist)/2;
            const nx=dx/dist, ny=dy/dist;
            const aDrag = drag && a === drag.node, bDrag = drag && b === drag.node;
            if (aDrag){
              b.x += nx*ov*2; b.y += ny*ov*2;
            } else if (bDrag){
              a.x -= nx*ov*2; a.y -= ny*ov*2;
            } else {
              a.x-=nx*ov; a.y-=ny*ov;
              b.x+=nx*ov; b.y+=ny*ov;
              if (pass === 0){
                const p = (a.vx*nx + a.vy*ny) - (b.vx*nx + b.vy*ny);
                a.vx -= p*nx*0.5; a.vy -= p*ny*0.5;
                b.vx += p*nx*0.5; b.vy += p*ny*0.5;
              }
            }
          }
        }
      }
      nodes.forEach(n => confine(n));
    }
  }

  function colorFor(pct){
    const mag = Math.min(Math.abs(pct)/10, 1);
    if (pct >= 0){
      const l = 46 + mag*12;
      return { core:`hsla(150,100%,${l+8}%,1)`, edge:`hsla(150,96%,${l-14}%,0.94)`,
               ring:`hsla(150,100%,70%,1)`, glow:'rgba(0,255,140,0.55)', text:'#02160c' };
    } else {
      const l = 52 + mag*10;
      return { core:`hsla(349,100%,${l+6}%,1)`, edge:`hsla(349,96%,${l-14}%,0.94)`,
               ring:`hsla(349,100%,72%,1)`, glow:'rgba(255,55,95,0.5)', text:'#2a0006' };
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    let hover = null;
    for (const n of nodes){
      const c = colorFor(n.pct);
      const grad = ctx.createRadialGradient(n.x-n.r*0.3, n.y-n.r*0.35, n.r*0.1, n.x, n.y, n.r);
      grad.addColorStop(0, c.core);
      grad.addColorStop(1, c.edge);
      ctx.save();
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = c.ring;
      ctx.stroke();
      // labels
      if (n.r >= 19){
        const fs = Math.max(9, Math.min(n.r*0.42, 17));
        ctx.fillStyle = c.text;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font = `700 ${fs}px 'Space Grotesk', sans-serif`;
        ctx.fillText(n.base, n.x, n.y - fs*0.42);
        ctx.font = `600 ${fs*0.8}px 'JetBrains Mono', monospace`;
        ctx.fillText((n.pct>=0?'+':'')+n.pct.toFixed(1)+'%', n.x, n.y + fs*0.55);
      }
      if (mouse.over){
        const d = Math.hypot(mouse.x-n.x, mouse.y-n.y);
        if (d <= n.r && (!hover || n.r < hover.r)) hover = n;
      }
    }
    // tooltip + cursor
    if (drag){
      tip.style.display='none';
      canvas.style.cursor='grabbing';
    } else if (hover && mouse.over){
      tip.style.display='block';
      const isT = hover.kind === 'tradfi' || hover.kind === 'stock';
      const cur = isT ? (hover.usd ? '$' : '') : '$';
      const priceTxt = isT ? cur+fmtNum(hover.price,2) : '$'+smartPrice(hover.price);
      const hiloTxt = isT
        ? (hover.high!=null ? `${cur}${fmtNum(hover.high,2)} / ${cur}${fmtNum(hover.low,2)}` : '—')
        : `${smartPrice(hover.high)} / ${smartPrice(hover.low)}`;
      const symLabel = isT ? (hover.full||hover.base)
        : `${hover.base}<span style="color:var(--muted2);font-weight:500">${hover.pair||''}</span>`;
      let html =
        `<div class="t-sym">${symLabel}</div>`+
        `<div class="t-row"><span class="k">Price</span><span class="num">${priceTxt}</span></div>`+
        `<div class="t-row"><span class="k">24h Chg</span><span class="num ${hover.pct>=0?'pos':'neg'}">${hover.pct>=0?'+':''}${hover.pct.toFixed(2)}%</span></div>`;
      if (hover.vol) html += `<div class="t-row"><span class="k">${isT?'Volume':'24h Vol'}</span><span class="num">${isT?'':'$'}${compact(hover.vol)}</span></div>`;
      html += `<div class="t-row"><span class="k">${isT?'Day H/L':'H / L'}</span><span class="num">${hiloTxt}</span></div>`;
      tip.innerHTML = html;
      const pad=14;
      let tx = mouse.clientX + pad, ty = mouse.clientY + pad;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      if (tx + tw > window.innerWidth) tx = mouse.clientX - tw - pad;
      if (ty + th > window.innerHeight) ty = mouse.clientY - th - pad;
      tip.style.left = tx+'px'; tip.style.top = ty+'px';
      canvas.style.cursor='grab';
    } else {
      tip.style.display='none';
      canvas.style.cursor='default';
    }
  }

  function loop(){ step(); draw(); requestAnimationFrame(loop); }

  canvas.addEventListener('mousemove', e=>{
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    mouse.clientX = e.clientX; mouse.clientY = e.clientY; mouse.over = true;
  });
  canvas.addEventListener('mouseleave', ()=>{ mouse.over=false; });

  // --- drag & drop: grab a bubble and move it anywhere ---
  function bubbleAt(mx, my){
    let hit = null;
    for (const n of nodes){
      const d = Math.hypot(mx - n.x, my - n.y);
      if (d <= n.r && (!hit || n.r < hit.r)) hit = n;   // topmost (smallest) under cursor
    }
    return hit;
  }
  canvas.addEventListener('mousedown', e=>{
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = bubbleAt(mx, my);
    if (hit){
      drag = { node:hit, dx:mx-hit.x, dy:my-hit.y, lastX:mx, lastY:my,
        startClientX:e.clientX, startClientY:e.clientY, moved:false };
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove', e=>{
    if (!drag) return;
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const n = drag.node;
    if (Math.hypot(e.clientX-drag.startClientX, e.clientY-drag.startClientY) > 4) drag.moved=true;
    n.x = Math.max(n.r+EDGE, Math.min(W-n.r-EDGE, mx - drag.dx));
    n.y = Math.max(n.r+EDGE_TOP, Math.min(H-n.r-EDGE, my - drag.dy));
    n.vx = mx - drag.lastX; n.vy = my - drag.lastY;   // carry momentum when released
    drag.lastX = mx; drag.lastY = my;
  });
  window.addEventListener('mouseup', e=>{
    const released=drag;
    drag=null;
    if (released && !released.moved){
      const n=released.node;
      openAssetMenu({
        id:n.id, name:n.name, kind:n.kind, cls:n.cls,
        custom:n.custom, rmsym:n.rmsym, source:n.source, cgId:n.cgId,
        tvSymbol:n.tvSymbol, tvExchange:n.tvExchange
      },
        { clientX:e.clientX, clientY:e.clientY });
    }
  });

  new ResizeObserver(resize).observe(canvas.parentElement);
  setTimeout(resize, 50);
  requestAnimationFrame(loop);

  return { setData };
})();

function customAssetSnapshot(c){
  const common = {
    id:'c:'+c.sym,
    rmsym:c.sym,
    custom:true,
    name:c.sym,
    source:c.source,
    cgId:c.cgId,
    tvSymbol:c.tvSymbol,
    tvExchange:c.tvExchange,
    usd:true
  };
  if (c.type === 'crypto'){
    if (c.source === 'coingecko'){
      const d = customCoinQuotes[c.sym];
      return { ...common, sub:'/USD', kind:'crypto', cls:'COIN',
        historyProvider:'coingecko', historySymbol:c.cgId,
        price:d ? d.price : null, chg:d ? d.chg : 0,
        high:d ? d.high : null, low:d ? d.low : null,
        vol:d ? d.vol : null, mcap:d ? d.mcap : 0 };
    }
    const t = tickerMap[c.sym];
    if (!t) return null;
    return { ...common, sub:'/USDT', kind:'crypto', cls:'COIN',
      historyProvider:'binance', historySymbol:c.sym+'USDT',
      price:+t.lastPrice, chg:+t.priceChangePercent,
      high:+t.highPrice, low:+t.lowPrice, vol:+t.quoteVolume, mcap:0 };
  }
  const d = customQuotes[c.sym];
  return { ...common, sub:'', kind:'stock', cls:'STOCK',
    historyProvider:'yahoo', historySymbol:c.sym.replace(/\./g,'-'),
    price:d ? d.price : null, chg:d ? d.chgPct : 0,
    high:d ? d.high : null, low:d ? d.low : null,
    vol:d ? d.vol : null, mcap:0 };
}

  const symbol=String(sym||'').toUpperCase();

function tradingViewUrl(asset){
  const id = asset.id || '';
  if (asset.kind === 'crypto'){
    if (asset.source === 'coingecko'){
      if (asset.tvSymbol && asset.tvExchange){
        return `https://www.tradingview.com/symbols/${encodeURIComponent(asset.tvSymbol)}/?exchange=${encodeURIComponent(asset.tvExchange)}`;
      }
      return `https://www.tradingview.com/search/?query=${encodeURIComponent(asset.name)}`;
    }
    const symbol = id === 'HYPE' ? 'HYPEUSDT' : `${asset.name}USDT`;
    const exchange = id === 'HYPE' ? 'BYBIT' : 'BINANCE';
    return `https://www.tradingview.com/symbols/${encodeURIComponent(symbol)}/?exchange=${exchange}`;
  }
  const map = {
    SPX:  { symbol:'SPX',    exchange:'SP' },
    NDX:  { symbol:'NDX',    exchange:'NASDAQ' },
    GOLD: { symbol:'XAUUSD', exchange:'OANDA' },
    OIL:  { symbol:'USOIL',  exchange:'TVC' }
  };
  const mapped = map[id] || { symbol:asset.name, exchange:'NASDAQ' };
  return `https://www.tradingview.com/symbols/${encodeURIComponent(mapped.symbol)}/?exchange=${mapped.exchange}`;
}

function openAssetMenu(asset, anchor){
  if (!asset || !anchor) return;
  const menu = $('#assetMenu');
  const title = $('#assetMenuTitle');
  const tv = $('#assetMenuTradingView');
  const remove = $('#assetMenuRemove');
  if (!menu || !title || !tv || !remove) return;

  activeAssetMenu = asset;
  title.textContent = `${asset.name} · ${asset.cls || (asset.kind === 'crypto' ? 'COIN' : 'ASSET')}`;
  tv.href = tradingViewUrl(asset);
  remove.hidden = false;
  remove.setAttribute('aria-hidden', 'false');
  menu.hidden = false;

  const rect = typeof anchor.getBoundingClientRect === 'function'
    ? anchor.getBoundingClientRect()
    : { left:anchor.clientX, right:anchor.clientX, top:anchor.clientY, bottom:anchor.clientY };
  const gap = 8;
  const left = Math.max(10, Math.min(rect.left, window.innerWidth - menu.offsetWidth - 10));
  const below = rect.bottom + gap;
  const top = below + menu.offsetHeight <= window.innerHeight - 10
    ? below
    : Math.max(10, rect.top - menu.offsetHeight - gap);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

function performanceBaseline(points, target){
  let found = null;
  for (const point of points){
    if (point[0] <= target) found = point;
    else break;
  }
  const maxGap = 10 * 24 * 60 * 60 * 1000;
  return found && target - found[0] <= maxGap ? found[1] : null;
}

function performancePct(current, baseline){
  return isFinite(+current) && isFinite(+baseline) && +baseline > 0
    ? ((+current - +baseline) / +baseline) * 100
    : null;
}

function performanceTargets(now=Date.now()){
  const d = new Date(now);
  return [
    { label:'1 MONTH', at:now - 30*24*60*60*1000 },
    { label:'1 YEAR', at:now - 365*24*60*60*1000 },
    { label:'YTD', at:Date.UTC(d.getUTCFullYear(),0,1) }
  ];
}

async function loadPerformanceHistory(asset){
  const provider = asset.historyProvider;
  const symbol = asset.historySymbol;
  if (!provider || !symbol) throw new Error('Historical source is unavailable');
  const key = `${provider}:${symbol}`;
  const cached = performanceCache.get(key);
  if (cached && Date.now() - cached.time < 10*60*1000) return cached.points;

  let points = [];
  if (provider === 'binance'){
    const r = await fetchWithTimeout(`https://api.binance.com/api/v3/klines?symbol=${encodeURIComponent(symbol)}&interval=1d&limit=400`);
    if (!r.ok) throw new Error('Binance history '+r.status);
    const data = await r.json();
    points = (Array.isArray(data) ? data : []).map(k => [+k[0], +k[4]]);
  } else if (provider === 'coingecko'){
    const r = await fetchWithTimeout(`${COINGECKO_BASE}/coins/${encodeURIComponent(symbol)}/market_chart?vs_currency=usd&days=365`);
    if (!r.ok) throw new Error('CoinGecko history '+r.status);
    const data = await r.json();
    points = Array.isArray(data.prices) ? data.prices.map(p => [+p[0], +p[1]]) : [];
  } else if (provider === 'yahoo'){
    const r = await fetchWithTimeout(`${APP_API_ORIGIN}/api/history?symbol=${encodeURIComponent(symbol)}`,{},20000);
    if (!r.ok) throw new Error('Market history '+r.status);
    const data = await r.json();
    points = Array.isArray(data.points) ? data.points.map(p => [+p[0], +p[1]]) : [];
  }
  points = points.filter(p => isFinite(p[0]) && isFinite(p[1]) && p[1] > 0).sort((a,b) => a[0]-b[0]);
  if (!points.length) throw new Error('Historical prices are empty');
  performanceCache.set(key, { time:Date.now(), points });
  return points;
}

async function openPerformance(asset){
  if (!asset) return;
  closeAssetMenu();
  const modal = $('#performanceModal');
  const title = $('#performanceTitle');
  const sub = $('#performanceSub');
  const grid = $('#performanceGrid');
  const status = $('#performanceStatus');
  const requestId = ++performanceRequestId;
  title.textContent = asset.name;
  sub.textContent = `24H ${asset.chg>=0?'+':''}${(+asset.chg||0).toFixed(2)}% · extended performance`;
  grid.innerHTML = performanceLoadingCards();
  status.textContent = 'Loading historical closes…';
  status.className = 'perf-status';
  modal.hidden = false;
  $('#performanceClose').focus();
  try {
    const points = await loadPerformanceHistory(asset);
    if (requestId !== performanceRequestId) return;
    const cards = performanceTargets().map(period => {
      const baseline = performanceBaseline(points, period.at);
      const value = performancePct(asset.price, baseline);
      if (value == null){
        return `<div class="perf-card"><div class="perf-label">${period.label}</div><div class="perf-value na">NO DATA</div></div>`;
      }
      return `<div class="perf-card"><div class="perf-label">${period.label}</div><div class="perf-value ${value>=0?'pos':'neg'}">${value>=0?'+':''}${value.toFixed(2)}%</div></div>`;
    });
    grid.innerHTML = cards.join('');
    status.textContent = 'Calculated from historical closing prices.';
  } catch(e){
    if (requestId !== performanceRequestId) return;
    grid.innerHTML = ['1 MONTH','1 YEAR','YTD'].map(label =>
      `<div class="perf-card"><div class="perf-label">${label}</div><div class="perf-value na">UNAVAILABLE</div></div>`
    ).join('');
    status.textContent = 'Historical performance could not be loaded right now.';
    status.className = 'perf-status err';
    console.warn('performance history failed', e);
  }
}

function renderMarketTable(){
  const rows = [];
  CRYPTO_LIST.forEach(c => {
    if (isAssetHidden(c.base)) return;
    const t = tickerMap[c.base];
    if (!t) return;
    const price = +t.lastPrice;
    rows.push({ id:c.base, name:c.base, sub:'/USDT', kind:'crypto', cls:'COIN', usd:true,
      historyProvider:'binance', historySymbol:c.base+'USDT',
      price, chg:+t.priceChangePercent, high:+t.highPrice, low:+t.lowPrice,
      vol:+t.quoteVolume, volUsd:true, mcap:price*c.supply });
  });
  if (hypeRow && !isAssetHidden('HYPE')){
    rows.push({ id:'HYPE', name:'HYPE', sub:'/USD', kind:'crypto', cls:'COIN', usd:true,
      source:'coingecko', cgId:'hyperliquid', historyProvider:'coingecko', historySymbol:'hyperliquid',
      price:hypeRow.price, chg:hypeRow.chg, high:hypeRow.high, low:hypeRow.low,
      vol:hypeRow.vol, volUsd:true, mcap:hypeRow.mcap });
  }
  TRADFI.forEach(f => {
    if (isAssetHidden(f.key)) return;
    const d = tradfiRows[f.key];
    if (!d) return;
    rows.push({ id:f.key, name:f.name, sub:f.sub, kind:'tradfi', cls:f.cls, usd:f.usd,
      historyProvider:'yahoo', historySymbol:f.ysym,
      price:d.price,
      chg:(d.chgPct!=null && isFinite(d.chgPct)) ? d.chgPct : (d.prev ? (d.price-d.prev)/d.prev*100 : 0),
      high:d.high, low:d.low, vol:d.vol, volUsd:false, mcap:f.mcap });
  });
  // user-added items share one normalized data model with the bubble panel.
  customItems.forEach(c => {
    const row = customAssetSnapshot(c);
    if (row) rows.push(row);
  });
  const sk = tableSort.key, sd = tableSort.dir;
  const num = v => (v==null || !isFinite(v)) ? -Infinity : v;
  rows.sort((a,b) => (num(a[sk]) - num(b[sk])) * sd);
  updateSortIndicators();

  const rowMeta = new Map(rows.map(r => [String(r.id), r]));
  $('#ticker-body').innerHTML = rows.map((r,i) => {
    const prev = prevPrices[r.id];
    let flash=''; if (r.price!=null && prev!==undefined && prev!==r.price) flash = r.price>prev ? 'fu':'fd';
    if (r.price!=null) prevPrices[r.id] = r.price;
    const eq = (r.kind==='tradfi' || r.kind==='stock');          // equity-style formatting (2 decimals)
    const fmtP = v => (v==null || (eq && v<=0)) ? null : (eq ? fmtNum(v,2) : smartPrice(v));
    const cur = r.usd ? '$' : '';
    const priceStr = fmtP(r.price)!=null ? cur+fmtP(r.price) : '<span style="color:var(--muted2)">…</span>';
    const highStr  = fmtP(r.high)!=null ? fmtP(r.high) : '—';
    const lowStr   = fmtP(r.low) !=null ? fmtP(r.low)  : '—';
    const tag = r.cls ? `<span class="kind-tag t-${r.cls}">${r.cls}</span>` : '';
    return `<tr class="asset-row" data-asset-id="${r.id}" tabindex="0" role="button" aria-label="${r.name} actions">
      <td><div class="sym-cell"><span class="rank">${i+1}</span><span class="base">${r.name}</span><span class="quote">${r.sub}</span>${tag}</div></td>
      <td class="pricecell num ${flash}">${priceStr}</td>
      <td><button class="chgpill perf-trigger num ${r.chg>=0?'pos':'neg'}" type="button" data-performance-id="${r.id}" aria-label="Open ${r.name} extended performance">${r.chg>=0?'+':''}${(r.chg||0).toFixed(2)}%</button></td>
      <td class="num">${highStr}</td>
      <td class="num">${lowStr}</td>
    </tr>`;
  }).join('');
  $('#ticker-body').querySelectorAll('.asset-row').forEach(row => {
    const asset = rowMeta.get(row.dataset.assetId);
    const open = () => openAssetMenu(asset, row);
    const performanceButton = row.querySelector('.perf-trigger');
    performanceButton.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      openPerformance(asset);
    });
    row.addEventListener('click', open);
    row.addEventListener('keydown', e => {
      if (e.target.closest('.perf-trigger')) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  });
}

/* ---- watchlist add/remove (coins via Binance/CoinGecko, stocks via CNBC) ---- */
function isKnownSymbol(sym){
  const defaultId=defaultAssetIdForSymbol(sym);
  return (defaultId && !isAssetHidden(defaultId)) || customItems.some(c=>c.sym===sym);
}
function pxMsg(text, kind){
  const el = $('#px-msg');
  el.textContent = text || '';
  el.className = 'px-msg' + (text?' show':'') + (kind?' '+kind:'');
}
async function cnbcQuoteOne(sym){
  try {
    const r = await fetch('https://quote.cnbc.com/quote-html-webservice/quote.htm?requestMethod=quick&fund=1&exthrs=1&output=json&symbols='+encodeURIComponent(sym), { cache:'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    let q = j.QuickQuoteResult && j.QuickQuoteResult.QuickQuote; if (!q) return null;
    const x = Array.isArray(q) ? q[0] : q;
    const price = parseFloat(x.last);
    if (!isFinite(price)) return null;
    return { price, chgPct:parseFloat(x.change_pct)||0, prev:parseFloat(x.previous_day_closing)||null,
             high:parseFloat(x.high)||null, low:parseFloat(x.low)||null, vol:x.volume?parseFloat(x.volume):null, name:x.name||sym };
  } catch(e){ return null; }
}

const COINGECKO_BASE = 'https://api.coingecko.com/api/v3';
const COINGECKO_ALIASES = {
  BP: { id:'backpack', name:'Backpack', tvSymbol:'BPUSDT', tvExchange:'MEXC' }
};

function normalizeCoinGeckoQuote(c){
  if (!c || !isFinite(+c.current_price)) return null;
  return {
    price:+c.current_price,
    chg:isFinite(+c.price_change_percentage_24h) ? +c.price_change_percentage_24h : 0,
    high:isFinite(+c.high_24h) ? +c.high_24h : null,
    low:isFinite(+c.low_24h) ? +c.low_24h : null,
    vol:isFinite(+c.total_volume) ? +c.total_volume : null,
    mcap:isFinite(+c.market_cap) ? +c.market_cap : 0
  };
}

async function coinGeckoMarket(ids){
  const unique = [...new Set(ids.filter(Boolean))];
  if (!unique.length) return [];
  const url = `${COINGECKO_BASE}/coins/markets?vs_currency=usd&ids=${encodeURIComponent(unique.join(','))}&price_change_percentage=24h`;
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error('CoinGecko HTTP '+r.status);
  const data = await r.json();
  return Array.isArray(data) ? data : [];
}

async function coinGeckoCoinOne(sym){
  try {
    const alias = COINGECKO_ALIASES[sym];
    let match = alias ? { id:alias.id, name:alias.name, symbol:sym } : null;
    if (!match){
      const r = await fetch(`${COINGECKO_BASE}/search?query=${encodeURIComponent(sym)}`, { cache:'no-store' });
      if (!r.ok) throw new Error('CoinGecko search HTTP '+r.status);
      const data = await r.json();
      const exact = (Array.isArray(data.coins) ? data.coins : [])
        .filter(c => String(c.symbol || '').toUpperCase() === sym)
        .sort((a,b) => (a.market_cap_rank || Infinity) - (b.market_cap_rank || Infinity));
      match = exact[0] || null;
    }
    if (!match) return null;
    const market = (await coinGeckoMarket([match.id]))[0];
    const quote = normalizeCoinGeckoQuote(market);
    if (!quote) return null;
    return {
      item:{
        sym,
        type:'crypto',
        source:'coingecko',
        cgId:match.id,
        name:match.name || sym,
        tvSymbol:alias && alias.tvSymbol,
        tvExchange:alias && alias.tvExchange
      },
      quote
    };
  } catch(e){
    console.warn('CoinGecko coin search failed', e);
    return null;
  }
}

async function fetchCustomCoinGecko(){
  const coins = customItems.filter(c => c.type === 'crypto' && c.source === 'coingecko' && c.cgId);
  if (!coins.length) return;
  try {
    const markets = await coinGeckoMarket(coins.map(c => c.cgId));
    const byId = new Map(markets.map(c => [c.id, c]));
    coins.forEach(item => {
      const quote = normalizeCoinGeckoQuote(byId.get(item.cgId));
      if (quote) customCoinQuotes[item.sym] = quote;
    });
    saveCustom();
    renderAll();
  } catch(e){ console.warn('custom CoinGecko refresh failed', e); }
}

async function addCustom(){
  const rawInput=($('#px-q').value||'').trim();
  const command=rawInput.toLowerCase().replace(/\s+/g,' ');
  if (command==='trenches' || command==='trenches refresh'){
    $('#px-q').value='';
    focusTrenches(command.endsWith(' refresh'));
    return;
  }
  const rawSym = rawInput.toUpperCase().replace(/[^A-Z0-9.\-]/g,'');
  const sym = rawSym === 'BACKPACK' ? 'BP' : rawSym;
  if (!sym){ $('#px-q').focus(); return; }
  const defaultId=defaultAssetIdForSymbol(sym);
  if (defaultId && isAssetHidden(defaultId)){
    hiddenAssets=hiddenAssets.filter(id=>id!==defaultId);
    saveHiddenAssets();
    $('#px-q').value='';
    renderAll();
    pxMsg(`Restored ${sym} to list`, 'ok');
    return;
  }
  const existingCustom = customItems.find(c => c.sym === sym);
  let replaceExistingStock = false;
  if (existingCustom){
    const alias = COINGECKO_ALIASES[sym];
    const isRequestedCoinMissing = alias && existingCustom.type !== 'crypto';
    if (!isRequestedCoinMissing){ pxMsg(`${sym} is already in the list`, 'err'); return; }
    replaceExistingStock = true;
  } else if (isKnownSymbol(sym)){
    pxMsg(`${sym} is already in the list`, 'err');
    return;
  }
  // 1) crypto on Binance?
  if (tickerMap[sym]){
    customItems.push({ sym, type:'crypto' }); saveCustom();
    $('#px-q').value=''; pxMsg(`Added ${sym} · crypto`, 'ok'); renderAll(); return;
  }
  // 2) coins not listed on Binance (including Backpack/BP)
  pxMsg(`Searching “${sym}”…`);
  const coin = await coinGeckoCoinOne(sym);
  if (coin){
    if (replaceExistingStock){
      customItems = customItems.filter(c => c.sym !== sym);
      delete customQuotes[sym];
    }
    customItems.push(coin.item);
    customCoinQuotes[sym] = coin.quote;
    saveCustom();
    $('#px-q').value='';
    pxMsg(`Added ${coin.item.name} (${sym}) · crypto`, 'ok');
    renderAll();
    return;
  }
  if (replaceExistingStock){
    pxMsg(`Backpack (BP) price could not be loaded right now`, 'err');
    return;
  }
  // 3) stock via CNBC
  const quote = await cnbcQuoteOne(sym);
  if (quote){
    customItems.push({ sym, type:'stock', name:quote.name }); customQuotes[sym] = quote; saveCustom();
    $('#px-q').value=''; pxMsg(`Added ${quote.name} (${sym})`, 'ok'); renderAll();
  } else {
    pxMsg(`“${sym}” not found as a coin or stock`, 'err');
  }
}
function removeAsset(asset){
  if (!asset) return false;
  if (asset.custom) return removeCustom(asset.rmsym || asset.name);
  const id=String(asset.id||'').trim();
  if (!id){ pxMsg('Asset could not be removed', 'err'); return false; }
  if (!isAssetHidden(id)){
    hiddenAssets.push(id);
    saveHiddenAssets();
  }
  renderAll();
  pxMsg(`Removed ${asset.name} · search ${id} to restore`, 'ok');
  return true;
}

function removeCustom(sym){
  const symbol = String(sym || '').trim().toUpperCase();
  const before = customItems.length;
  customItems = customItems.filter(c => c.sym !== symbol);
  if (customItems.length === before){
    pxMsg(`${symbol || 'Asset'} is not in the added list`, 'err');
    return false;
  }
  delete customQuotes[symbol];
  delete customCoinQuotes[symbol];
  saveCustom();
  renderAll();
  pxMsg(`Removed ${symbol} from list`, 'ok');
  return true;
}

// reflect the active sort column/direction in the table headers
function updateSortIndicators(){
  document.querySelectorAll('#panel-table thead th[data-sort]').forEach(th => {
    const ar = th.querySelector('.sort-ar'); if (!ar) return;
    if (th.dataset.sort === tableSort.key){
      ar.textContent = tableSort.dir === -1 ? '▼' : '▲';
      th.classList.add('sorted');
    } else { ar.textContent = ''; th.classList.remove('sorted'); }
  });
}

/* HYPE (Hyperliquid) — not listed on Binance, sourced from CoinGecko */
async function fetchHype(){
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=hyperliquid&price_change_percentage=24h');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const c = (await r.json())[0];
    if(!c) throw new Error('empty');
    hypeRow = { price:c.current_price, chg:c.price_change_percentage_24h||0, high:c.high_24h, low:c.low_24h, vol:c.total_volume, mcap:c.market_cap };
    cacheSet('cc_hype', hypeRow);
    renderMarketTable();
    refreshBubbles();
  } catch(e){ console.warn('hype failed', e); }   // fall back to cached value
}

/* Traditional markets (S&P 500, NASDAQ, Oil, Gold) via CNBC's public quote API.
   Direct CORS (no proxy, no API key) in a single batch request — this works even on
   networks where third-party CORS proxies are blocked. gold-api.com is a last-resort
   fallback for gold only. Whatever loads is cached so the panel never blanks out. */
const CNBC_BASE = 'https://quote.cnbc.com/quote-html-webservice/quote.htm?requestMethod=quick&fund=1&exthrs=1&output=json&symbols=';
const CNBC_MAP = { '.SPX':'SPX', '.IXIC':'NDX', '@CL.1':'OIL', '@GC.1':'GOLD' };
async function fetchTradFi(){
  let ok = 0, gotGold = false;
  const stockSyms = customItems.filter(c => c.type==='stock').map(c => c.sym);
  const syms = ['.SPX','.IXIC','@CL.1','@GC.1', ...stockSyms];   // TradFi + added stocks in one batch
  try {
    const r = await fetch(CNBC_BASE + encodeURIComponent(syms.join('|')), { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    let q = (j.QuickQuoteResult && j.QuickQuoteResult.QuickQuote) || [];
    if (!Array.isArray(q)) q = [q];
    q.forEach(x => {
      const price = parseFloat(x.last);
      if (!isFinite(price)) return;
      const quote = {
        price,
        chgPct: parseFloat(x.change_pct),
        prev: parseFloat(x.previous_day_closing) || null,
        high: parseFloat(x.high) || null,
        low:  parseFloat(x.low)  || null,
        vol:  x.volume ? parseFloat(x.volume) : null,
        name: x.name
      };
      const key = CNBC_MAP[x.symbol];
      if (key){ tradfiRows[key] = quote; ok++; if (key === 'GOLD') gotGold = true; }
      else { customQuotes[x.symbol] = quote; }      // an added stock
    });
  } catch(e){ console.warn('tradfi (CNBC) failed', e); }
  if (!gotGold){                                   // CORS-native fallback for gold
    try { const r = await fetch('https://api.gold-api.com/price/XAU');
          if (r.ok){ const g = await r.json();
            tradfiRows.GOLD = { price:g.price, chgPct:0, prev:null, high:null, low:null, vol:null }; ok++; } }
    catch(e){}
  }
  if (ok) cacheSet('cc_tradfi', tradfiRows);
  cacheSet('cc_customq', customQuotes);
  renderMarketTable();
  refreshBubbles();
}
