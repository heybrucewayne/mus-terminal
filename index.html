<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MUS Terminal</title>
<meta name="theme-color" content="#071416" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #05070e;
    --bg2: #04060c;
    --panel: linear-gradient(160deg, rgba(26,36,62,0.46) 0%, rgba(11,17,32,0.36) 100%);
    --panel-flat: rgba(13,19,34,0.6);
    --glass: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.12);
    --border-soft: rgba(255,255,255,0.06);
    --green: #00ff88;
    --green-dim: #0a8f55;
    --red: #ff4466;
    --red-dim: #a8324a;
    --yellow: #ffd23f;
    --orange: #ff9f43;
    --text: #c7d2e0;
    --text-bright: #e8f0fb;
    --muted: #5b6b82;
    --muted2: #3c4a5e;
    --accent-glow: rgba(0,255,136,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  html { background: var(--bg); }
  body { background: transparent; position: relative; }
  /* colorful aurora behind the frosted-glass panels */
  body::before {
    content: ''; position: fixed; inset: -25%; z-index: -2; pointer-events: none;
    background:
      radial-gradient(52% 56% at 10% 12%, rgba(0,255,170,0.55), transparent 70%),
      radial-gradient(56% 58% at 92% 6%,  rgba(70,150,255,0.58), transparent 70%),
      radial-gradient(60% 64% at 84% 92%, rgba(185,100,255,0.50), transparent 70%),
      radial-gradient(54% 60% at 12% 96%, rgba(255,80,130,0.46), transparent 70%),
      radial-gradient(46% 48% at 50% 50%, rgba(0,220,255,0.30), transparent 72%);
    filter: saturate(145%);
    animation: auroraDrift 26s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(2.5%, -2.5%, 0) scale(1.1); }
  }

  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* ===== APP SHELL ===== */
  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }
  ::selection { background: rgba(0,255,136,0.25); }

  /* ===== GRID ===== */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 0.6fr 1.25fr 1fr 1.05fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    -webkit-backdrop-filter: blur(24px) saturate(165%);
    backdrop-filter: blur(24px) saturate(165%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.16),
      inset 0 0 0 1px rgba(255,255,255,0.02),
      0 10px 34px rgba(0,0,0,0.45),
      0 2px 10px rgba(0,0,0,0.30);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }
  /* glass specular sheen from the top */
  .panel::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 16px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 42%);
  }

  .panel-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
  }
  .panel-head h2 {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-bright);
    display: flex; align-items: center; gap: 7px;
  }
  .panel-head h2 .ico { color: var(--green); font-size: 12px; }
  .panel-head .head-right { margin-left: auto; display:flex; align-items:center; gap:8px; }
  .panel-head .meta { font-size: 9.5px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .warn-badge {
    display:none;
    font-size: 9px; letter-spacing:.5px;
    color: var(--orange);
    background: rgba(255,159,67,0.1);
    border:1px solid rgba(255,159,67,0.3);
    padding: 2px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .warn-badge.show { display:inline-block; }

  .panel-body { flex: 1 1 auto; min-height: 0; position: relative; }
  .scroll { overflow-y: auto; overflow-x: hidden; height: 100%; }

  /* scrollbars */
  .scroll::-webkit-scrollbar, .panel-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll::-webkit-scrollbar-thumb, .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* ===== BUBBLES ===== */
  #bubbleCanvas { display:block; width:100%; height:100%; cursor: crosshair; }
  .bubble-legend {
    position:absolute; top:8px; right:10px; display:flex; gap:12px;
    font-size:9.5px; letter-spacing:1px; color:var(--muted); text-transform:uppercase;
    pointer-events:none;
    background: rgba(12,18,34,0.5);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border:1px solid var(--border-soft);
    border-radius:999px;
    padding:5px 13px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .bubble-legend span { display:flex; align-items:center; gap:5px; }
  .dotg, .dotr, .dott { width:8px; height:8px; border-radius:50%; }
  .dotg { background: var(--green); box-shadow:0 0 6px var(--green); }
  .dotr { background: var(--red); box-shadow:0 0 6px var(--red); }
  .dott { background: #ffd23f; box-shadow:0 0 6px #ffd23f; }

  #bubbleTip {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    background: rgba(16,22,40,0.72);
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 9px 11px;
    font-size: 11px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 12px 34px rgba(0,0,0,0.55);
    display: none;
    min-width: 150px;
  }
  #bubbleTip .t-sym { font-weight: 700; font-size: 13px; letter-spacing: 1px; color: var(--text-bright); margin-bottom: 4px; }
  #bubbleTip .t-row { display:flex; justify-content:space-between; gap:14px; margin: 2px 0; }
  #bubbleTip .t-row .k { color: var(--muted); }

  /* ===== PRICE TABLE ===== */
  table.ticker { width: 100%; border-collapse: collapse; }
  table.ticker thead th {
    position: sticky; top: 0; z-index: 2;
    background: rgba(10,15,28,0.82);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    text-align: right;
    font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    padding: 8px 12px 7px;
    border-bottom: 1px solid var(--border-soft);
  }
  table.ticker thead th:first-child { text-align: left; }
  table.ticker thead th[data-sort] { cursor: pointer; user-select: none; transition: color .12s; }
  table.ticker thead th[data-sort]:hover { color: var(--text-bright); }
  table.ticker thead th.sorted { color: var(--green); }
  .sort-ar { font-size: 8px; color: var(--green); }
  table.ticker tbody td {
    padding: 6px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
  }
  table.ticker tbody td:first-child { text-align: left; }
  table.ticker tbody tr:hover { background: rgba(255,255,255,0.05); }
  table.ticker tbody tr.asset-row { cursor: pointer; }
  table.ticker tbody tr.asset-row:focus-visible { outline: 1px solid rgba(0,255,136,.7); outline-offset: -1px; }
  .sym-cell { display:flex; align-items:center; gap:8px; }
  .sym-cell .base { font-weight: 600; color: var(--text-bright); letter-spacing:.5px; }
  .sym-cell .quote { font-size: 9px; color: var(--muted2); }
  .rank { color: var(--muted2); font-size: 10px; width: 16px; display:inline-block; text-align:right; }
  .kind-tag { font-size:8px; letter-spacing:.5px; padding:1px 7px; border-radius:999px; margin-left:4px; font-family:'Space Grotesk',sans-serif; font-weight:600; border:1px solid; white-space:nowrap; }
  .kind-tag.t-COIN      { color:#2dd4bf; border-color:rgba(45,212,191,.34); background:rgba(45,212,191,.10); }
  .kind-tag.t-STOCK     { color:#3fb6ff; border-color:rgba(63,182,255,.34); background:rgba(63,182,255,.10); }
  .kind-tag.t-INDEX     { color:#c77dff; border-color:rgba(199,125,255,.34); background:rgba(199,125,255,.10); }
  .kind-tag.t-COMMODITY { color:#ffd23f; border-color:rgba(255,210,63,.34); background:rgba(255,210,63,.10); }

  /* prices search / add */
  #panel-table .panel-body { display:flex; flex-direction:column; }
  .px-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; }
  .px-search { display:flex; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border-soft); }
  .px-search input { flex:1; }
  .px-search .btn { padding:6px 10px; font-size:11px; }
  .px-watchlist {
    display:flex; align-items:center; flex-wrap:wrap; gap:5px;
    min-height:34px; padding:6px 10px; border-bottom:1px solid var(--border-soft);
    background:rgba(255,255,255,0.018);
  }
  .px-watchlist:empty { display:none; }
  .px-watchlist-label {
    color:var(--muted); font-size:8px; letter-spacing:1px;
    text-transform:uppercase; margin-right:2px;
  }
  .watch-chip {
    display:inline-flex; align-items:center; gap:4px;
    padding:5px 10px; border:1px solid rgba(0,255,136,.30);
    border-radius:999px; background:rgba(0,255,136,.08);
    color:var(--text-bright); font:600 9px 'JetBrains Mono',monospace;
    cursor:pointer; transition:background .12s, border-color .12s, transform .12s;
  }
  .watch-chip:hover { background:rgba(0,255,136,.18); border-color:rgba(0,255,136,.65); transform:translateY(-1px); }
  .px-msg { font-size:10px; padding:0 12px; height:0; overflow:hidden; color:var(--muted); transition:height .15s, padding .15s; }
  .px-msg.show { height:auto; padding:5px 12px; }
  .px-msg.ok { color:var(--green); } .px-msg.err { color:var(--red); }
  @keyframes flashUp { 0%{ background: rgba(0,255,136,0.22);} 100%{ background: transparent;} }
  @keyframes flashDown { 0%{ background: rgba(255,68,102,0.22);} 100%{ background: transparent;} }
  td.fu { animation: flashUp 1.1s ease-out; }
  td.fd { animation: flashDown 1.1s ease-out; }
  .pricecell { font-weight: 600; color: var(--text-bright); }
  .chgpill { display:inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; min-width: 58px; border:1px solid transparent; }
  .chgpill.pos { background: rgba(0,255,136,0.12); border-color: rgba(0,255,136,0.28); }
  .chgpill.neg { background: rgba(255,68,102,0.12); border-color: rgba(255,68,102,0.28); }

  /* ===== INPUTS / BUTTONS ===== */
  input, select {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    width: 100%;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus, select:focus { border-color: rgba(0,255,136,0.55); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 3px rgba(0,255,136,0.10); }
  input::placeholder { color: var(--muted2); }
  input[type=date] { color-scheme: dark; }
  .btn {
    background: rgba(0,255,136,0.14);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,255,136,0.4);
    color: var(--green);
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover { background: rgba(0,255,136,0.26); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 16px rgba(0,255,136,0.22); }
  .btn.full { width:100%; }
  .x-btn {
    background: none; border: none; color: var(--muted2);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 2px;
    transition: color .15s;
  }
  .x-btn:hover { color: var(--red); }

  .empty {
    color: var(--muted); font-size: 11px; text-align:center;
    padding: 18px 12px; line-height: 1.6;
  }
  .empty .ico { font-size: 20px; display:block; margin-bottom:6px; opacity:.5; }

  /* ===== SKELETONS ===== */
  .skel { position:relative; overflow:hidden; background:rgba(255,255,255,0.05); border-radius:9px; }
  .skel::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skel-row { height: 26px; margin: 7px 12px; }

  @media (max-width: 1380px){
    body { font-size: 12px; }
    .grid { grid-template-columns: 0.58fr 1.2fr 1fr 1fr; }
  }

</style>
<style id="terminal-refresh">
  /* Focused desktop terminal: no page scroll, only the prices list scrolls internally. */
  html, body {
    height: 100%;
    min-height: 100%;
    overflow: hidden;
  }

  body {
    background: transparent;
  }

  body::before {
    z-index: 0;
    inset: -18px;
    opacity: 0.94;
    background:
      linear-gradient(135deg, rgba(4, 14, 15, 0.18), rgba(3, 10, 15, 0.30)),
      url('background.jpeg') center / cover no-repeat;
    filter: blur(1px) saturate(108%);
    animation: none;
    transform: none;
  }

  #app {
    position: relative;
    z-index: 1;
    width: min(1680px, 100%);
    height: 100vh;
    min-height: 0;
    margin: 0 auto;
    padding: 14px clamp(14px, 2.4vw, 36px) 18px;
    gap: 12px;
  }

  .grid {
    display: grid;
    flex: 1 1 auto;
    min-height: 0;
    height: auto;
    grid-template-columns: minmax(0, 1.55fr) minmax(360px, 1fr);
    grid-template-rows: minmax(0, 1fr);
    gap: 12px;
  }

  .panel {
    min-width: 0;
    min-height: 0;
    isolation: isolate;
    border: 1px solid rgba(214, 255, 240, 0.2);
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(12, 30, 29, 0.28), rgba(5, 14, 18, 0.22));
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    -webkit-backdrop-filter: blur(7px) saturate(125%);
    backdrop-filter: blur(7px) saturate(125%);
  }

  .panel::before {
    z-index: 0;
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), transparent 34%);
  }

  .panel > .panel-head,
  .panel > .panel-body { position: relative; z-index: 1; }

  .panel-head {
    min-height: 45px;
    padding: 10px 13px;
    background: rgba(255, 255, 255, 0.035);
    border-bottom-color: rgba(214, 255, 240, 0.09);
  }

  .panel-head h2 { font-size: 0.62rem; letter-spacing: 0.16em; }
  .panel-head h2 .ico { font-size: 0.76rem; }
  .panel-head .meta { font-size: 0.48rem; letter-spacing: 0.08em; }

  #panel-bubbles { border-color: rgba(141, 244, 182, 0.26); }
  #panel-bubbles .panel-body {
    background:
      linear-gradient(135deg, rgba(4, 19, 20, 0.07), rgba(4, 10, 14, 0.04)),
      radial-gradient(circle at 48% 48%, rgba(57, 220, 134, 0.045), transparent 58%);
  }
  #panel-table .panel-body {
    background: linear-gradient(135deg, rgba(4, 16, 18, 0.07), rgba(4, 10, 14, 0.04));
  }
  #panel-table .sym-cell { min-width:0; flex-wrap:nowrap; }
  #bubbleCanvas { position: relative; z-index: 1; }

  .bubble-legend {
    z-index: 2;
    top: 10px;
    right: 12px;
    padding: 5px 10px;
    border-color: rgba(174, 220, 198, 0.14);
    background: rgba(5, 14, 15, 0.66);
  }

  .bubble-legend,
  table.ticker thead th,
  .btn {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }

  .asset-menu {
    position: fixed;
    z-index: 100;
    min-width: 218px;
    display: grid;
    gap: 6px;
    padding: 9px;
    border: 1px solid rgba(214,255,240,.28);
    border-radius: 12px;
    background: rgba(7, 18, 20, .94);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
    backdrop-filter: blur(18px) saturate(145%);
    box-shadow: 0 16px 36px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .asset-menu[hidden] { display:none; }
  .asset-menu-title {
    padding: 2px 4px 5px;
    color: var(--text-bright);
    font: 700 10px 'JetBrains Mono', monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .asset-menu-action {
    display:block;
    width:100%;
    padding:8px 9px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    background:rgba(255,255,255,.055);
    color:var(--text-bright);
    font:600 9px 'Space Grotesk', sans-serif;
    letter-spacing:.06em;
    text-align:left;
    text-decoration:none;
    cursor:pointer;
    touch-action:manipulation;
  }
  .asset-menu-action:hover { background:rgba(0,255,136,.14); border-color:rgba(0,255,136,.48); color:var(--green); }
  .asset-menu-action.danger { color:var(--red); border-color:rgba(255,68,102,.28); background:rgba(255,68,102,.08); }
  .asset-menu-action.danger:hover { background:rgba(255,68,102,.22); border-color:var(--red); color:#fff; }

  .px-search {
    padding: 9px 10px;
    background: rgba(255, 255, 255, 0.025);
    border-bottom-color: rgba(214, 255, 240, 0.08);
  }

  .px-search input { min-width: 0; }
  .px-search .btn { white-space: nowrap; }
  table.ticker { table-layout: fixed; }
  table.ticker thead th,
  table.ticker tbody td { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.ticker thead th:first-child,
  table.ticker tbody td:first-child { width:34%; }
  table.ticker thead th:not(:first-child),
  table.ticker tbody td:not(:first-child) { width:16.5%; }
  table.ticker thead th {
    padding-top: 9px;
    padding-bottom: 8px;
    background: rgba(6, 15, 19, 0.54);
  }
  table.ticker tbody td { padding-top: 8px; padding-bottom: 8px; }

  @media (max-width: 1380px) {
    .grid { grid-template-columns: minmax(0, 1.15fr) minmax(500px, 1fr); }
    table.ticker thead th,
    table.ticker tbody td { padding-left:7px; padding-right:7px; }
    .sym-cell { gap:5px; }
    .sym-cell .quote { display:none; }
    .kind-tag { margin-left:1px; padding-left:5px; padding-right:5px; }
  }

  @media (max-width: 900px) {
    html, body { overflow-y: auto; }
    #app { height: auto; min-height: 100vh; }
    .grid {
      min-height: 0;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(420px, 1fr);
    }
  }

  @media (max-width: 700px) {
    #app { min-height: 100vh; }
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(360px, 1fr) minmax(360px, 1fr);
    }
    .panel { min-height: 360px; }
  }

  @media (max-width: 520px) {
    .px-search { flex-wrap: wrap; }
    .px-search input { flex: 1 1 100%; }
    .px-search .btn { flex: 0 0 auto; }
  }

</style>
</head>
<body>
<div id="app">
  <div class="grid">
    <!-- BUBBLES -->
    <section class="panel" id="panel-bubbles">
      <div class="panel-head">
        <h2><span class="ico">●</span> BUBBLES</h2>
        <div class="head-right">
          <span class="warn-badge" id="warn-bubbles">⚠ LIVE DATA UNAVAILABLE</span>
          <span class="meta">SIZE = 24H % MOVE</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="bubble-legend">
          <span><i class="dotg"></i>GAINERS</span>
          <span><i class="dotr"></i>LOSERS</span>
          <span style="opacity:.7">✥ DRAG</span>
        </div>
        <canvas id="bubbleCanvas"></canvas>
      </div>
    </section>

    <!-- PRICE TABLE -->
    <section class="panel" id="panel-table">
      <div class="panel-head">
        <h2><span class="ico">▤</span> PRICES</h2>
        <div class="head-right">
          <span class="warn-badge" id="warn-table">⚠ LIVE DATA UNAVAILABLE</span>
          <span class="meta">SORTABLE ↕</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="px-search">
          <input id="px-q" placeholder="Add coin or stock — e.g. TSLA, AAPL, ADA" autocomplete="off" spellcheck="false" />
          <button class="btn" id="px-add" title="Add to list">+ ADD</button>
        </div>
        <div id="px-watchlist" class="px-watchlist" aria-label="Added assets"></div>
        <div id="px-msg" class="px-msg"></div>
        <div class="px-scroll scroll">
          <table class="ticker">
            <thead>
              <tr>
                <th data-sort="mcap">Market <span class="sort-ar"></span></th>
                <th data-sort="price">Price <span class="sort-ar"></span></th>
                <th data-sort="chg">24h % <span class="sort-ar"></span></th>
                <th data-sort="high">24h High <span class="sort-ar"></span></th>
                <th data-sort="low">24h Low <span class="sort-ar"></span></th>
              </tr>
            </thead>
            <tbody id="ticker-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>
</div>

<div id="bubbleTip"></div>
<div id="assetMenu" class="asset-menu" hidden role="menu" aria-label="Asset actions">
  <div id="assetMenuTitle" class="asset-menu-title"></div>
  <a id="assetMenuTradingView" class="asset-menu-action" target="_blank" rel="noopener noreferrer" role="menuitem">VIEW IN TRADINGVIEW</a>
  <button id="assetMenuRemove" class="asset-menu-action danger" type="button" role="menuitem">REMOVE FROM LIST</button>
</div>

<script>
/* ============================================================
   MUS TERMINAL — vanilla JS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const fmtNum = (n, d=2) => Number(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
function smartPrice(p){
  p = +p;
  if (p >= 1000) return fmtNum(p, 2);
  if (p >= 1)    return fmtNum(p, 3);
  if (p >= 0.01) return fmtNum(p, 4);
  return fmtNum(p, 8);
}
function compact(n){
  n = +n;
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(2)+'K';
  return n.toFixed(0);
}
const cacheGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const cacheSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
function setWarn(id, on){ const el = $(id); if(el) el.classList.toggle('show', on); }

/* ---------- Global state ---------- */
let tickerMap = {};        // BASE -> ticker obj (USDT pairs)
const EXCLUDE = /(UPUSDT|DOWNUSDT|BULLUSDT|BEARUSDT)$/;

/* ============================================================
   BINANCE TICKER FETCH (shared by bubbles and table)
   ============================================================ */
async function fetchTickers(){
  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
    if (!res.ok) throw new Error('HTTP '+res.status);
    const all = await res.json();
    const usdt = all.filter(t =>
      t.symbol.endsWith('USDT') && !EXCLUDE.test(t.symbol) && +t.quoteVolume > 0
    );
    tickerMap = {};
    usdt.forEach(t => { tickerMap[t.symbol.replace(/USDT$/,'')] = t; });
    cacheSet('cc_tickers', usdt);
    setWarn('#warn-bubbles', false);
    setWarn('#warn-table', false);
    renderAll();
    return true;
  } catch (e) {
    console.warn('ticker fetch failed', e);
    const cached = cacheGet('cc_tickers');
    setWarn('#warn-bubbles', true);
    setWarn('#warn-table', true);
    if (cached && Object.keys(tickerMap).length === 0){
      tickerMap = {};
      cached.forEach(t => { tickerMap[t.symbol.replace(/USDT$/,'')] = t; });
      renderAll();
    }
    return false;
  }
}

function renderAll(){
  refreshBubbles();
  renderMarketTable();
}

// bubble dataset = everything in the Prices table (crypto + TradFi),
// sized by |24h % change| → biggest movers (up OR down) get the biggest bubbles.
const TRADFI_BUBBLE = { SPX:'S&P', NDX:'NASDAQ', GOLD:'GOLD', OIL:'OIL' };
function refreshBubbles(){
  const items = [];
  CRYPTO_LIST.forEach(c => {
    const t = tickerMap[c.base];
    if (!t) return;
    const pct = +t.priceChangePercent;
    items.push({ base:c.base, pair:'/USDT', kind:'crypto', usd:true, pct,
      price:+t.lastPrice, vol:+t.quoteVolume, high:+t.highPrice, low:+t.lowPrice, size:Math.abs(pct) });
  });
  if (hypeRow){
    const pct = +hypeRow.chg || 0;
    items.push({ base:'HYPE', pair:'/USD', kind:'crypto', usd:true, pct,
      price:hypeRow.price, vol:hypeRow.vol, high:hypeRow.high, low:hypeRow.low, size:Math.abs(pct) });
  }
  TRADFI.forEach(f => {
    const d = tradfiRows[f.key];
    if (!d) return;
    const pct = (d.chgPct!=null && isFinite(d.chgPct)) ? d.chgPct : (d.prev ? (d.price-d.prev)/d.prev*100 : 0);
    items.push({ base:TRADFI_BUBBLE[f.key]||f.name, full:f.name, kind:'tradfi', usd:f.usd, pct,
      price:d.price, vol:d.vol, high:d.high, low:d.low, size:Math.abs(pct) });
  });
  bubbles.setData(items);
}

/* ============================================================
   1. CRYPTO BUBBLES (canvas physics)
   ============================================================ */
const bubbles = (function(){
  const canvas = $('#bubbleCanvas');
  const ctx = canvas.getContext('2d');
  const tip = $('#bubbleTip');
  let W=0, H=0, dpr = window.devicePixelRatio || 1;
  let nodes = [];
  let mouse = { x:-999, y:-999, over:false };
  let drag = null;   // { node, dx, dy, lastX, lastY } while a bubble is being dragged
  const EDGE = 12, EDGE_TOP = 44;   // reserve the legend area and keep bubbles inside the canvas

  function resize(){
    const r = canvas.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    layoutRadii();
  }

  let raw = [];
  // setData accepts normalized items: { base, pair?, pct, price, vol, high, low, size }
  // `size` (= |24h % change|) drives the radius; `vol` is shown in the tooltip only.
  function setData(items){
    raw = items;
    layoutRadii();
  }
  function layoutRadii(){
    if (!raw.length || !W) return;
    const sizes = raw.map(c => c.size);
    const maxV = Math.max(...sizes), minV = Math.min(...sizes);
    const area = W * H;
    // scale radii so total bubble area leaves enough room for stable collision resolution
    const target = area * 0.28;
    let rawAreas = raw.map(c => {
      const t = (Math.sqrt(c.size) - Math.sqrt(minV)) / (Math.sqrt(maxV) - Math.sqrt(minV) || 1);
      return 0.3 + t; // weight (floor so a flat coin is still visible)
    });
    const sumW = rawAreas.reduce((a,b)=>a+b,0);
    const k = target / (sumW * Math.PI);
    const existing = {};
    nodes.forEach(n => existing[n.base] = n);
    nodes = raw.map((c, i) => {
      const base = c.base;
      let r = Math.sqrt(rawAreas[i] * k);
      r = Math.max(15, Math.min(r, Math.min(W,H)*0.30));
      const prev = existing[base];
      return {
        base, pair:c.pair, pct:c.pct, kind:c.kind, usd:c.usd, full:c.full,
        price: c.price, vol: c.vol,
        high: c.high, low: c.low,
        r,
        x: prev ? prev.x : (EDGE + r + Math.random()*Math.max(1, W-2*(r+EDGE))),
        y: prev ? prev.y : (EDGE_TOP + r + Math.random()*Math.max(1, H-(r+EDGE_TOP)-(r+EDGE))),
        vx: prev ? prev.vx : (Math.random()-0.5)*0.4,
        vy: prev ? prev.vy : (Math.random()-0.5)*0.4
      };
    });
  }

  function step(){
    for (let i=0;i<nodes.length;i++){
      const a = nodes[i];
      if (drag && a === drag.node) continue;   // pinned to the cursor while dragging
      // gentle drift
      a.vx += (Math.random()-0.5)*0.03;
      a.vy += (Math.random()-0.5)*0.03;
      a.vx *= 0.985; a.vy *= 0.985;
      // mild centering pull
      a.vx += ((W/2 - a.x)) * 0.00012;
      a.vy += ((H/2 - a.y)) * 0.00012;
      a.x += a.vx; a.y += a.vy;
      // walls — bounce while staying clear of the border & legend
      const minX=a.r+EDGE, maxX=W-a.r-EDGE, minY=a.r+EDGE_TOP, maxY=H-a.r-EDGE;
      if (a.x < minX){ a.x = minX; a.vx = Math.abs(a.vx)*0.7; }
      if (a.x > maxX){ a.x = maxX; a.vx = -Math.abs(a.vx)*0.7; }
      if (a.y < minY){ a.y = minY; a.vy = Math.abs(a.vy)*0.7; }
      if (a.y > maxY){ a.y = maxY; a.vy = -Math.abs(a.vy)*0.7; }
    }
    // Two relaxation passes prevent persistent overlap after resize or rapid data updates.
    for (let pass=0; pass<2; pass++){
      for (let i=0;i<nodes.length;i++){
        for (let j=i+1;j<nodes.length;j++){
          const a=nodes[i], b=nodes[j];
          let dx=b.x-a.x, dy=b.y-a.y;
          let dist=Math.hypot(dx,dy);
          if (dist < 0.001){
            const angle = ((i+1)*31 + (j+1)*17) % 360 * Math.PI / 180;
            dx=Math.cos(angle)*0.01; dy=Math.sin(angle)*0.01; dist=0.01;
          }
          const min=a.r+b.r+9;
          if (dist < min){
            const ov=(min-dist)/2;
            const nx=dx/dist, ny=dy/dist;
            const aDrag = drag && a === drag.node, bDrag = drag && b === drag.node;
            if (aDrag){
              b.x += nx*ov*2; b.y += ny*ov*2;
            } else if (bDrag){
              a.x -= nx*ov*2; a.y -= ny*ov*2;
            } else {
              a.x-=nx*ov; a.y-=ny*ov;
              b.x+=nx*ov; b.y+=ny*ov;
              if (pass === 0){
                const p = (a.vx*nx + a.vy*ny) - (b.vx*nx + b.vy*ny);
                a.vx -= p*nx*0.5; a.vy -= p*ny*0.5;
                b.vx += p*nx*0.5; b.vy += p*ny*0.5;
              }
            }
          }
        }
      }
    }
  }

  function colorFor(pct){
    const mag = Math.min(Math.abs(pct)/10, 1);
    if (pct >= 0){
      const l = 46 + mag*12;
      return { core:`hsla(150,100%,${l+8}%,1)`, edge:`hsla(150,96%,${l-14}%,0.94)`,
               ring:`hsla(150,100%,70%,1)`, glow:'rgba(0,255,140,0.55)', text:'#02160c' };
    } else {
      const l = 52 + mag*10;
      return { core:`hsla(349,100%,${l+6}%,1)`, edge:`hsla(349,96%,${l-14}%,0.94)`,
               ring:`hsla(349,100%,72%,1)`, glow:'rgba(255,55,95,0.5)', text:'#2a0006' };
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    let hover = null;
    for (const n of nodes){
      const c = colorFor(n.pct);
      const grad = ctx.createRadialGradient(n.x-n.r*0.3, n.y-n.r*0.35, n.r*0.1, n.x, n.y, n.r);
      grad.addColorStop(0, c.core);
      grad.addColorStop(1, c.edge);
      ctx.save();
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = c.ring;
      ctx.stroke();
      // labels
      if (n.r >= 19){
        const fs = Math.max(9, Math.min(n.r*0.42, 17));
        ctx.fillStyle = c.text;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font = `700 ${fs}px 'Space Grotesk', sans-serif`;
        ctx.fillText(n.base, n.x, n.y - fs*0.42);
        ctx.font = `600 ${fs*0.8}px 'JetBrains Mono', monospace`;
        ctx.fillText((n.pct>=0?'+':'')+n.pct.toFixed(1)+'%', n.x, n.y + fs*0.55);
      }
      if (mouse.over){
        const d = Math.hypot(mouse.x-n.x, mouse.y-n.y);
        if (d <= n.r && (!hover || n.r < hover.r)) hover = n;
      }
    }
    // tooltip + cursor
    if (drag){
      tip.style.display='none';
      canvas.style.cursor='grabbing';
    } else if (hover && mouse.over){
      tip.style.display='block';
      const isT = hover.kind === 'tradfi';
      const cur = isT ? (hover.usd ? '$' : '') : '$';
      const priceTxt = isT ? cur+fmtNum(hover.price,2) : '$'+smartPrice(hover.price);
      const hiloTxt = isT
        ? (hover.high!=null ? `${cur}${fmtNum(hover.high,2)} / ${cur}${fmtNum(hover.low,2)}` : '—')
        : `${smartPrice(hover.high)} / ${smartPrice(hover.low)}`;
      const symLabel = isT ? (hover.full||hover.base)
        : `${hover.base}<span style="color:var(--muted2);font-weight:500">${hover.pair||''}</span>`;
      let html =
        `<div class="t-sym">${symLabel}</div>`+
        `<div class="t-row"><span class="k">Price</span><span class="num">${priceTxt}</span></div>`+
        `<div class="t-row"><span class="k">24h Chg</span><span class="num ${hover.pct>=0?'pos':'neg'}">${hover.pct>=0?'+':''}${hover.pct.toFixed(2)}%</span></div>`;
      if (hover.vol) html += `<div class="t-row"><span class="k">${isT?'Volume':'24h Vol'}</span><span class="num">${isT?'':'$'}${compact(hover.vol)}</span></div>`;
      html += `<div class="t-row"><span class="k">${isT?'Day H/L':'H / L'}</span><span class="num">${hiloTxt}</span></div>`;
      tip.innerHTML = html;
      const pad=14;
      let tx = mouse.clientX + pad, ty = mouse.clientY + pad;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      if (tx + tw > window.innerWidth) tx = mouse.clientX - tw - pad;
      if (ty + th > window.innerHeight) ty = mouse.clientY - th - pad;
      tip.style.left = tx+'px'; tip.style.top = ty+'px';
      canvas.style.cursor='grab';
    } else {
      tip.style.display='none';
      canvas.style.cursor='crosshair';
    }
  }

  function loop(){ step(); draw(); requestAnimationFrame(loop); }

  canvas.addEventListener('mousemove', e=>{
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    mouse.clientX = e.clientX; mouse.clientY = e.clientY; mouse.over = true;
  });
  canvas.addEventListener('mouseleave', ()=>{ mouse.over=false; });

  // --- drag & drop: grab a bubble and move it anywhere ---
  function bubbleAt(mx, my){
    let hit = null;
    for (const n of nodes){
      const d = Math.hypot(mx - n.x, my - n.y);
      if (d <= n.r && (!hit || n.r < hit.r)) hit = n;   // topmost (smallest) under cursor
    }
    return hit;
  }
  canvas.addEventListener('mousedown', e=>{
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = bubbleAt(mx, my);
    if (hit){ drag = { node:hit, dx:mx-hit.x, dy:my-hit.y, lastX:mx, lastY:my }; e.preventDefault(); }
  });
  window.addEventListener('mousemove', e=>{
    if (!drag) return;
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const n = drag.node;
    n.x = Math.max(n.r+EDGE, Math.min(W-n.r-EDGE, mx - drag.dx));
    n.y = Math.max(n.r+EDGE_TOP, Math.min(H-n.r-EDGE, my - drag.dy));
    n.vx = mx - drag.lastX; n.vy = my - drag.lastY;   // carry momentum when released
    drag.lastX = mx; drag.lastY = my;
  });
  window.addEventListener('mouseup', ()=>{ drag = null; });

  new ResizeObserver(resize).observe(canvas.parentElement);
  setTimeout(resize, 50);
  requestAnimationFrame(loop);

  return { setData };
})();

/* ============================================================
   2. LIVE MARKET TABLE  (curated crypto + TradFi, ranked by mcap)
   ============================================================ */
// curated crypto + approx circulating supply (used only to rank by market cap)
const CRYPTO_LIST = [
  { base:'BTC',  supply:19.8e6  },
  { base:'ETH',  supply:120.5e6 },
  { base:'BNB',  supply:142e6   },
  { base:'SOL',  supply:540e6   },
  { base:'XRP',  supply:60e9    },
  { base:'DOGE', supply:150e9   },
  { base:'TRX',  supply:95e9    },
  { base:'ZEC',  supply:16.5e6  },
  { base:'LINK', supply:680e6   },
  { base:'NEAR', supply:1.25e9  },
  { base:'TAO',  supply:7.5e6   },
  { base:'SUI',  supply:3.4e9   },
];
// traditional markets via CNBC (mcap = static rank weight, USD)
const TRADFI = [
  { key:'SPX',  name:'S&P 500', sub:'',            cls:'INDEX',     ysym:'^GSPC', mcap:50e12, usd:false },
  { key:'NDX',  name:'NASDAQ',  sub:'',            cls:'INDEX',     ysym:'^IXIC', mcap:35e12, usd:false },
  { key:'GOLD', name:'GOLD',    sub:'XAU · OZ',    cls:'COMMODITY', ysym:'GC=F',  mcap:22e12, usd:true  },
  { key:'OIL',  name:'OIL WTI', sub:'CRUDE · BBL', cls:'COMMODITY', ysym:'CL=F',  mcap:12e12, usd:true  },
];

let hypeRow      = cacheGet('cc_hype')    || null;  // HYPE via CoinGecko (not on Binance)
let tradfiRows   = cacheGet('cc_tradfi')  || {};    // key -> CNBC row
let customItems  = cacheGet('cc_custom')  || [];    // user watchlist: [{sym, type:'crypto'|'stock', name}]
let customQuotes = cacheGet('cc_customq') || {};    // sym -> CNBC quote for added stocks
let prevPrices = {};
let tableSort  = { key:'mcap', dir:-1 };           // default: market cap, descending
const saveCustom = () => { cacheSet('cc_custom', customItems); cacheSet('cc_customq', customQuotes); };
let activeAssetMenu = null;

function tradingViewUrl(asset){
  const id = asset.id || '';
  if (asset.kind === 'crypto'){
    const symbol = id === 'HYPE' ? 'HYPEUSDT' : `${asset.name}USDT`;
    const exchange = id === 'HYPE' ? 'BYBIT' : 'BINANCE';
    return `https://www.tradingview.com/symbols/${encodeURIComponent(symbol)}/?exchange=${exchange}`;
  }
  const map = {
    SPX:  { symbol:'SPX',    exchange:'SP' },
    NDX:  { symbol:'NDX',    exchange:'NASDAQ' },
    GOLD: { symbol:'XAUUSD', exchange:'OANDA' },
    OIL:  { symbol:'USOIL',  exchange:'TVC' }
  };
  const mapped = map[id] || { symbol:asset.name, exchange:'NASDAQ' };
  return `https://www.tradingview.com/symbols/${encodeURIComponent(mapped.symbol)}/?exchange=${mapped.exchange}`;
}

function closeAssetMenu(){
  const menu = $('#assetMenu');
  if (menu) menu.hidden = true;
  activeAssetMenu = null;
}

function openAssetMenu(asset, anchor){
  if (!asset || !anchor) return;
  const menu = $('#assetMenu');
  const title = $('#assetMenuTitle');
  const tv = $('#assetMenuTradingView');
  const remove = $('#assetMenuRemove');
  if (!menu || !title || !tv || !remove) return;

  activeAssetMenu = asset;
  title.textContent = `${asset.name} · ${asset.cls || (asset.kind === 'crypto' ? 'COIN' : 'ASSET')}`;
  tv.href = tradingViewUrl(asset);
  remove.hidden = !asset.custom;
  remove.setAttribute('aria-hidden', String(!asset.custom));
  menu.hidden = false;

  const rect = anchor.getBoundingClientRect();
  const gap = 8;
  const left = Math.max(10, Math.min(rect.left, window.innerWidth - menu.offsetWidth - 10));
  const below = rect.bottom + gap;
  const top = below + menu.offsetHeight <= window.innerHeight - 10
    ? below
    : Math.max(10, rect.top - menu.offsetHeight - gap);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

$('#assetMenuTradingView').addEventListener('click', closeAssetMenu);
$('#assetMenuRemove').addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  const asset = activeAssetMenu;
  if (!asset || !asset.custom) return;
  const symbol = asset.rmsym || asset.name;
  closeAssetMenu();
  removeCustom(symbol);
});
document.addEventListener('click', e => {
  if (!activeAssetMenu) return;
  if (e.target.closest('#assetMenu, .asset-row, .watch-chip')) return;
  closeAssetMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAssetMenu();
});

function renderMarketTable(){
  const rows = [];
  CRYPTO_LIST.forEach(c => {
    const t = tickerMap[c.base];
    if (!t) return;
    const price = +t.lastPrice;
    rows.push({ id:c.base, name:c.base, sub:'/USDT', kind:'crypto', cls:'COIN', usd:true,
      price, chg:+t.priceChangePercent, high:+t.highPrice, low:+t.lowPrice,
      vol:+t.quoteVolume, volUsd:true, mcap:price*c.supply });
  });
  if (hypeRow){
    rows.push({ id:'HYPE', name:'HYPE', sub:'/USD', kind:'crypto', cls:'COIN', usd:true,
      price:hypeRow.price, chg:hypeRow.chg, high:hypeRow.high, low:hypeRow.low,
      vol:hypeRow.vol, volUsd:true, mcap:hypeRow.mcap });
  }
  TRADFI.forEach(f => {
    const d = tradfiRows[f.key];
    if (!d) return;
    rows.push({ id:f.key, name:f.name, sub:f.sub, kind:'tradfi', cls:f.cls, usd:f.usd,
      price:d.price,
      chg:(d.chgPct!=null && isFinite(d.chgPct)) ? d.chgPct : (d.prev ? (d.price-d.prev)/d.prev*100 : 0),
      high:d.high, low:d.low, vol:d.vol, volUsd:false, mcap:f.mcap });
  });
  // user-added watchlist items (kept out of the bubbles; mcap:0 → sorts to the bottom by default)
  customItems.forEach(c => {
    if (c.type === 'crypto'){
      const t = tickerMap[c.sym]; if (!t) return;
      const price = +t.lastPrice;
      rows.push({ id:'c:'+c.sym, rmsym:c.sym, custom:true, name:c.sym, sub:'/USDT', kind:'crypto', cls:'COIN', usd:true,
        price, chg:+t.priceChangePercent, high:+t.highPrice, low:+t.lowPrice, vol:+t.quoteVolume, mcap:0 });
    } else {
      const d = customQuotes[c.sym];
      rows.push({ id:'c:'+c.sym, rmsym:c.sym, custom:true, name:c.sym, sub:'', kind:'stock', cls:'STOCK', usd:true,
        price: d? d.price : null, chg: d? d.chgPct : 0,
        high: d? d.high : null, low: d? d.low : null, vol: d? d.vol : null, mcap:0 });
    }
  });
  const sk = tableSort.key, sd = tableSort.dir;
  const num = v => (v==null || !isFinite(v)) ? -Infinity : v;
  rows.sort((a,b) => (num(a[sk]) - num(b[sk])) * sd);
  updateSortIndicators();

  const rowMeta = new Map(rows.map(r => [String(r.id), r]));
  $('#ticker-body').innerHTML = rows.map((r,i) => {
    const prev = prevPrices[r.id];
    let flash=''; if (r.price!=null && prev!==undefined && prev!==r.price) flash = r.price>prev ? 'fu':'fd';
    if (r.price!=null) prevPrices[r.id] = r.price;
    const eq = (r.kind==='tradfi' || r.kind==='stock');          // equity-style formatting (2 decimals)
    const fmtP = v => (v==null || (eq && v<=0)) ? null : (eq ? fmtNum(v,2) : smartPrice(v));
    const cur = r.usd ? '$' : '';
    const priceStr = fmtP(r.price)!=null ? cur+fmtP(r.price) : '<span style="color:var(--muted2)">…</span>';
    const highStr  = fmtP(r.high)!=null ? fmtP(r.high) : '—';
    const lowStr   = fmtP(r.low) !=null ? fmtP(r.low)  : '—';
    const tag = r.cls ? `<span class="kind-tag t-${r.cls}">${r.cls}</span>` : '';
    return `<tr class="asset-row" data-asset-id="${r.id}" tabindex="0" role="button" aria-label="${r.name} actions">
      <td><div class="sym-cell"><span class="rank">${i+1}</span><span class="base">${r.name}</span><span class="quote">${r.sub}</span>${tag}</div></td>
      <td class="pricecell num ${flash}">${priceStr}</td>
      <td><span class="chgpill num ${r.chg>=0?'pos':'neg'}">${r.chg>=0?'+':''}${(r.chg||0).toFixed(2)}%</span></td>
      <td class="num">${highStr}</td>
      <td class="num">${lowStr}</td>
    </tr>`;
  }).join('');
  $('#ticker-body').querySelectorAll('.asset-row').forEach(row => {
    const asset = rowMeta.get(row.dataset.assetId);
    const open = () => openAssetMenu(asset, row);
    row.addEventListener('click', open);
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  });
}

/* ---- watchlist add/remove (coins via Binance, stocks via CNBC) ---- */
function isKnownSymbol(sym){
  return CRYPTO_LIST.some(c=>c.base===sym) || sym==='HYPE' ||
         TRADFI.some(f=>f.key===sym) || customItems.some(c=>c.sym===sym);
}
function pxMsg(text, kind){
  const el = $('#px-msg');
  el.textContent = text || '';
  el.className = 'px-msg' + (text?' show':'') + (kind?' '+kind:'');
}
async function cnbcQuoteOne(sym){
  try {
    const r = await fetch('https://quote.cnbc.com/quote-html-webservice/quote.htm?requestMethod=quick&fund=1&exthrs=1&output=json&symbols='+encodeURIComponent(sym), { cache:'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    let q = j.QuickQuoteResult && j.QuickQuoteResult.QuickQuote; if (!q) return null;
    const x = Array.isArray(q) ? q[0] : q;
    const price = parseFloat(x.last);
    if (!isFinite(price)) return null;
    return { price, chgPct:parseFloat(x.change_pct)||0, prev:parseFloat(x.previous_day_closing)||null,
             high:parseFloat(x.high)||null, low:parseFloat(x.low)||null, vol:x.volume?parseFloat(x.volume):null, name:x.name||sym };
  } catch(e){ return null; }
}
async function addCustom(){
  const sym = ($('#px-q').value||'').trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,'');
  if (!sym){ $('#px-q').focus(); return; }
  if (isKnownSymbol(sym)){ pxMsg(`${sym} is already in the list`, 'err'); return; }
  // 1) crypto on Binance?
  if (tickerMap[sym]){
    customItems.push({ sym, type:'crypto' }); saveCustom();
    $('#px-q').value=''; pxMsg(`Added ${sym} · crypto`, 'ok'); renderWatchlist(); renderMarketTable(); return;
  }
  // 2) stock via CNBC
  pxMsg(`Searching “${sym}”…`);
  const quote = await cnbcQuoteOne(sym);
  if (quote){
    customItems.push({ sym, type:'stock', name:quote.name }); customQuotes[sym] = quote; saveCustom();
    $('#px-q').value=''; pxMsg(`Added ${quote.name} (${sym})`, 'ok'); renderWatchlist(); renderMarketTable();
  } else {
    pxMsg(`“${sym}” not found as a coin or stock`, 'err');
  }
}
function removeCustom(sym){
  const symbol = String(sym || '').trim().toUpperCase();
  const before = customItems.length;
  customItems = customItems.filter(c => c.sym !== symbol);
  if (customItems.length === before){
    pxMsg(`${symbol || 'Asset'} is not in the added list`, 'err');
    return false;
  }
  delete customQuotes[symbol];
  saveCustom();
  renderWatchlist();
  renderMarketTable();
  pxMsg(`Removed ${symbol} from list`, 'ok');
  return true;
}

function renderWatchlist(){
  const box = $('#px-watchlist');
  if (!box) return;
  box.replaceChildren();
  if (!customItems.length) return;

  const title = document.createElement('span');
  title.className = 'px-watchlist-label';
  title.textContent = 'ADDED';
  box.append(title);

  customItems.forEach(item => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'watch-chip';
    chip.textContent = item.sym;
    chip.title = `${item.sym} actions`;
    chip.setAttribute('aria-label', `${item.sym} actions`);
    chip.onclick = () => openAssetMenu({
      id:`c:${item.sym}`,
      rmsym:item.sym,
      name:item.sym,
      kind:item.type,
      cls:item.type === 'crypto' ? 'COIN' : 'STOCK',
      custom:true
    }, chip);
    box.append(chip);
  });
}

// reflect the active sort column/direction in the table headers
function updateSortIndicators(){
  document.querySelectorAll('#panel-table thead th[data-sort]').forEach(th => {
    const ar = th.querySelector('.sort-ar'); if (!ar) return;
    if (th.dataset.sort === tableSort.key){
      ar.textContent = tableSort.dir === -1 ? '▼' : '▲';
      th.classList.add('sorted');
    } else { ar.textContent = ''; th.classList.remove('sorted'); }
  });
}

/* HYPE (Hyperliquid) — not listed on Binance, sourced from CoinGecko */
async function fetchHype(){
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=hyperliquid&price_change_percentage=24h');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const c = (await r.json())[0];
    if(!c) throw new Error('empty');
    hypeRow = { price:c.current_price, chg:c.price_change_percentage_24h||0, high:c.high_24h, low:c.low_24h, vol:c.total_volume, mcap:c.market_cap };
    cacheSet('cc_hype', hypeRow);
    renderMarketTable();
    refreshBubbles();
  } catch(e){ console.warn('hype failed', e); }   // fall back to cached value
}

/* Traditional markets (S&P 500, NASDAQ, Oil, Gold) via CNBC's public quote API.
   Direct CORS (no proxy, no API key) in a single batch request — this works even on
   networks where third-party CORS proxies are blocked. gold-api.com is a last-resort
   fallback for gold only. Whatever loads is cached so the panel never blanks out. */
const CNBC_BASE = 'https://quote.cnbc.com/quote-html-webservice/quote.htm?requestMethod=quick&fund=1&exthrs=1&output=json&symbols=';
const CNBC_MAP = { '.SPX':'SPX', '.IXIC':'NDX', '@CL.1':'OIL', '@GC.1':'GOLD' };
async function fetchTradFi(){
  let ok = 0, gotGold = false;
  const stockSyms = customItems.filter(c => c.type==='stock').map(c => c.sym);
  const syms = ['.SPX','.IXIC','@CL.1','@GC.1', ...stockSyms];   // TradFi + added stocks in one batch
  try {
    const r = await fetch(CNBC_BASE + encodeURIComponent(syms.join('|')), { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    let q = (j.QuickQuoteResult && j.QuickQuoteResult.QuickQuote) || [];
    if (!Array.isArray(q)) q = [q];
    q.forEach(x => {
      const price = parseFloat(x.last);
      if (!isFinite(price)) return;
      const quote = {
        price,
        chgPct: parseFloat(x.change_pct),
        prev: parseFloat(x.previous_day_closing) || null,
        high: parseFloat(x.high) || null,
        low:  parseFloat(x.low)  || null,
        vol:  x.volume ? parseFloat(x.volume) : null,
        name: x.name
      };
      const key = CNBC_MAP[x.symbol];
      if (key){ tradfiRows[key] = quote; ok++; if (key === 'GOLD') gotGold = true; }
      else { customQuotes[x.symbol] = quote; }      // an added stock
    });
  } catch(e){ console.warn('tradfi (CNBC) failed', e); }
  if (!gotGold){                                   // CORS-native fallback for gold
    try { const r = await fetch('https://api.gold-api.com/price/XAU');
          if (r.ok){ const g = await r.json();
            tradfiRows.GOLD = { price:g.price, chgPct:0, prev:null, high:null, low:null, vol:null }; ok++; } }
    catch(e){}
  }
  if (ok) cacheSet('cc_tradfi', tradfiRows);
  cacheSet('cc_customq', customQuotes);
  renderMarketTable();
  refreshBubbles();
}

/* ============================================================
   INIT + SCHEDULERS
   ============================================================ */
// loading skeletons for table
$('#ticker-body').innerHTML = Array.from({length:8}).map(()=>
  `<tr><td colspan="5" style="padding:0"><div class="skel skel-row"></div></td></tr>`).join('');

// prices watchlist: add a coin or stock by symbol
$('#px-add').onclick = addCustom;
$('#px-q').addEventListener('keydown', e => { if (e.key === 'Enter') addCustom(); });
renderWatchlist();

// click a column header to sort by it (toggles asc/desc)
document.querySelectorAll('#panel-table thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (tableSort.key === key) tableSort.dir *= -1;
    else tableSort = { key, dir: -1 };   // new column starts descending (highest first)
    renderMarketTable();
  });
});

fetchTickers();
fetchHype();
fetchTradFi();

// early retries: if no TradFi loaded yet (a proxy was briefly down), try again soon
setTimeout(() => { if (!Object.keys(tradfiRows).length) fetchTradFi(); }, 5000);
setTimeout(() => { if (!Object.keys(tradfiRows).length) fetchTradFi(); }, 15000);

setInterval(fetchTickers, 5000);      // 5s price refresh (Binance)
setInterval(fetchHype, 60*1000);      // 60s (CoinGecko — HYPE)
setInterval(fetchTradFi, 60*1000);    // 60s (CNBC — S&P/NASDAQ/Gold/Oil)
</script>
