<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>MUS Terminal</title>
  <desc>Mint M monogram on a dark terminal tile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102423" />
      <stop offset="1" stop-color="#071416" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b2ffd5" />
      <stop offset="1" stop-color="#35e98d" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <path d="M17 45V19l15 15 15-15v26" fill="none" stroke="url(#mint)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="32" cy="11" r="3" fill="#35e98d" />
</svg>
